  // Cria o acesso do colaborador e grava a ficha. Usado pelo formulário individual e pela
  // importação da planilha, para os dois criarem o login exatamente do mesmo jeito.
  // A conta é identificada pelo CPF: dois colaboradores de mesmo primeiro nome não se atrapalham.
  async function criarAcessoColaborador(nome, cpf, extras){
    const credencial = await createUserWithEmailAndPassword(authSecundario, emailPorCpf(cpf), cpf);
    // Os documentos são ligados ao funcionarioId, não ao login. Usando o CPF como
    // funcionarioId, se um dia for preciso excluir e cadastrar de novo (nome digitado
    // errado, por exemplo), os documentos já enviados continuam aparecendo para a pessoa.
    // Na migração de um acesso antigo, o funcionarioId de lá vem em extras e é preservado.
    const ficha = Object.assign({
      nome: nome, cpf: cpf, funcionarioId: 'cpf'+cpf, loginPorCpf: true, criadoEm: new Date().toISOString()
    }, extras || {});
    await setDoc(doc(dbF,'portal_funcionarios', credencial.user.uid), ficha);
    await signOut(authSecundario);
    return credencial.user.uid;
  }

  window.salvarColaborador = async function(id){
    const nome = document.getElementById('f-col-nome').value.trim().replace(/\s+/g,' ');
    const cpf = document.getElementById('f-col-cpf').value.replace(/\D/g,'');
    const erroEl = document.getElementById('f-col-erro');
    const btn = document.getElementById('f-col-btn');
    erroEl.style.color = 'var(--vermelho)';
    erroEl.textContent = '';
    if(!nome){ erroEl.textContent = 'Informe o nome completo.'; return; }
    if(cpf.length!==11){ erroEl.textContent = 'O CPF precisa ter 11 números.'; return; }
    if(!normalizar(nome)){ erroEl.textContent = 'O nome precisa ter letras ou números.'; return; }
    btn.disabled = true;
    btn.textContent = 'Salvando...';
    try{
      const datas = {
        dataAdmissao: document.getElementById('f-col-admissao').value || '',
        dataNascimento: document.getElementById('f-col-nascimento').value || ''
      };
      if(id){
        const contatos = {
          email: (document.getElementById('f-col-email')||{}).value || '',
          telefone: (document.getElementById('f-col-telefone')||{}).value || '',
          chavePix: (document.getElementById('f-col-pix')||{}).value || ''
        };
        await updateDoc(doc(dbF,'portal_funcionarios',id), Object.assign({ nome: nome, cpf: cpf }, datas, contatos));
      }else{
        await criarAcessoColaborador(nome, cpf, datas);
      }
      fecharModal();
      await renderAdminColaboradores();
    }catch(e){
      btn.disabled = false;
      btn.textContent = 'Salvar';
      const codigo = e && e.code ? e.code : '';
      if(codigo === 'auth/email-already-in-use'){
        erroEl.textContent = 'Já existe um acesso com esse CPF.';
      }else if(codigo === 'auth/weak-password'){

      }else{

  window.excluirColaborador = async function(id){
    const item = listaFuncionariosAdmin.find(function(f){ return f._id===id; }) || {};
    const funcionarioId = item.funcionarioId || '';
    // Conta o que será apagado junto, para a confirmação não ser uma surpresa.
    let quantosDocs = 0;
    try{
      const snap = await getDocs(query(collection(dbF,'portal_documentos'), where('funcionarioId','==', funcionarioId)));
      snap.forEach(function(){ quantosDocs++; });
    }catch(e){}
    const aviso = 'Excluir o cadastro de '+(item.nome||'este colaborador')+'?\n\n'+
      'O acesso dele ao portal para de funcionar e serão apagados:\n'+

      '· a conversa de dúvidas\n'+
      '· a inscrição de notificações\n\n'+

    try{

      // Inscrições de notificação daquele colaborador

  // ===== Importação da planilha de colaboradores =====
  // Lê a planilha do RH (nome, CPF, admissão e nascimento), casa cada linha com quem já está
  // cadastrado e mostra tudo para conferência. Nada é gravado antes de você confirmar.

  function paraDataISO(valor){
    if(valor === null || valor === undefined || valor === '') return '';
    if(valor && typeof valor.getFullYear === 'function' && !isNaN(valor.getTime())){
      const mm = String(valor.getMonth()+1).padStart(2,'0');
      const dd = String(valor.getDate()).padStart(2,'0');
      return valor.getFullYear()+'-'+mm+'-'+dd;
    }
    const texto = String(valor).trim();
    const br = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(br) return br[3]+'-'+br[2].padStart(2,'0')+'-'+br[1].padStart(2,'0');
    const iso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[0];
    // Data que veio como número de série do Excel (ex: 45670)
    const numero = Number(texto);
    if(numero > 10000 && numero < 80000){
      const d = new Date(Date.UTC(1899,11,30) + numero*86400000);
      return d.toISOString().slice(0,10);
    }
    return '';
  }

  // Os nomes da planilha vêm abreviados ("Cassiane M. de O. Barros") ou com partículas a mais
  // ("Bernardo Ferreira dos Santos"). Aqui cada pedaço do nome menor precisa aparecer, na ordem,
  // dentro do nome maior — aceitando inicial no lugar do nome inteiro.
  function nomesCompativeis(a, b){
    const pa = a.split(' ').filter(Boolean), pb = b.split(' ').filter(Boolean);
    if(pa.length < 2 || pb.length < 2) return false;
    const curto = pa.length <= pb.length ? pa : pb;
    const longo = pa.length <= pb.length ? pb : pa;
    if(curto[0] !== longo[0]) return false;
    if(curto[curto.length-1] !== longo[longo.length-1]) return false;
    let i = 0;
    for(let c = 0; c < curto.length; c++){
      let achou = false;
      while(i < longo.length){
        const l = longo[i], k = curto[c];
        i++;
        if(l === k || (k.length===1 && l[0]===k) || (l.length===1 && k[0]===l)){ achou = true; break; }
      }
      if(!achou) return false;
    }
    return true;
  }
  function vincularFichaPorPlanilha(linha){
    const cpf = linha.cpf;
    if(cpf){
      const porCpf = listaFuncionariosAdmin.find(function(f){ return String(f.cpf||'').replace(/\D/g,'') === cpf; });
      if(porCpf) return { ficha: porCpf, criterio: 'cpf' };
    }
    const alvo = normalizarNome(linha.nome);
    const exato = listaFuncionariosAdmin.find(function(f){ return normalizarNome(f.nome) === alvo; });
    if(exato) return { ficha: exato, criterio: 'exato' };
    let melhor = null, melhorNota = 0;
    listaFuncionariosAdmin.forEach(function(f){
      const nota = semelhanca(alvo, normalizarNome(f.nome));
      if(nota > melhorNota){ melhorNota = nota; melhor = f; }
    });
    if(melhor && melhorNota >= 0.85) return { ficha: melhor, criterio: 'parecido' };
    const porPartes = listaFuncionariosAdmin.find(function(f){ return nomesCompativeis(alvo, normalizarNome(f.nome)); });
    if(porPartes) return { ficha: porPartes, criterio: 'parecido' };
    return { ficha: null, criterio: 'novo' };
  }

  function lerPlanilhaColaboradores(dados){
    const wb = XLSX.read(dados, { type:'array', cellDates:true });
    for(let s=0; s<wb.SheetNames.length; s++){
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[s]], { header:1, blankrows:false, defval:'' });
      // Acha a linha de títulos pela coluna de CPF e descobre onde está cada informação.
      let iCab = -1, cols = null;
      for(let i=0; i<linhas.length && i<15; i++){
        const linha = linhas[i].map(function(c){ return String(c||'').toUpperCase(); });
        const cCpf = linha.findIndex(function(c){ return /C\.?\s*P\.?\s*F/.test(c); });
        if(cCpf >= 0){
          iCab = i;
          cols = {
            cpf: cCpf,
            admissao: linha.findIndex(function(c){ return /ADMISS/.test(c); }),
            nascimento: linha.findIndex(function(c){ return /NASC/.test(c); }),
            nome: Math.max(0, linha.findIndex(function(c){ return /NOME/.test(c); }))
          };
          break;
        }
      }
      if(iCab < 0) continue;
      const encontradas = [];
      for(let i=iCab+1; i<linhas.length; i++){
        const linha = linhas[i];
        const nome = String(linha[cols.nome]||'').replace(/\s+/g,' ').trim();
        const cpf = String(linha[cols.cpf]||'').replace(/\D/g,'');
        if(!nome || nome.length < 3) continue;
        encontradas.push({
          nome: nome,
          cpf: cpf.length===11 ? cpf : '',
          cpfBruto: String(linha[cols.cpf]||'').trim(),
          dataAdmissao: cols.admissao >= 0 ? paraDataISO(linha[cols.admissao]) : '',
          dataNascimento: cols.nascimento >= 0 ? paraDataISO(linha[cols.nascimento]) : ''
        });
      }
      if(encontradas.length) return encontradas;
    }
    return [];
  }

  window.processarPlanilha = async function(){
    const arquivo = (document.getElementById('f-imp-arquivo').files||[])[0];
    const erroEl = document.getElementById('f-imp-erro');
    erroEl.style.color = 'var(--vermelho)';
    if(!arquivo){ erroEl.textContent = 'Escolha a planilha.'; return; }
    if(!window.XLSX){ erroEl.textContent = 'O leitor de planilha não carregou. Verifique a internet e recarregue a página.'; return; }
    fecharModal();
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio">Lendo a planilha...</div>';
    try{
      await carregarFuncionariosAdmin(true);
      const buffer = await arquivo.arrayBuffer();
      const linhas = lerPlanilhaColaboradores(new Uint8Array(buffer));
      if(!linhas.length){
        cont.innerHTML = '<div class="vazio">Não encontrei uma coluna de CPF nessa planilha.</div>'+
          '<button class="btn btn-outline btn-full" style="margin-top:1rem" onclick="mostrarAdminTab(\'colaboradores\')">Voltar</button>';
        return;
      }
      importAtual = linhas.map(function(l){
        const vinculo = vincularFichaPorPlanilha(l);
        const ficha = vinculo.ficha;
        const item = Object.assign({}, l, {
          fichaId: ficha ? ficha._id : '',
          criterio: vinculo.criterio,
          gravado: false,
          falhou: ''
        });
        item.acao = definirAcaoImport(item, ficha);
        item.incluir = item.acao !== 'nada' && item.acao !== 'sem-cpf' && item.acao !== 'cpf-diferente';
        return item;
      });
      renderRevisaoImport();
    }catch(e){
      console.error(e);
      cont.innerHTML = '<div class="vazio">Não foi possível ler essa planilha.</div>'+
        '<button class="btn btn-outline btn-full" style="margin-top:1rem" onclick="mostrarAdminTab(\'colaboradores\')">Voltar</button>';
    }
  };

  function definirAcaoImport(item, ficha){
    if(!item.cpf) return 'sem-cpf';
    if(!ficha) return 'criar';
    const cpfFicha = String(ficha.cpf||'').replace(/\D/g,'');
    if(cpfFicha && cpfFicha !== item.cpf) return 'cpf-diferente';
    // Ficha antiga (login montado pelo nome completo): precisa de acesso novo pelo CPF.
    if(!ficha.loginPorCpf) return 'migrar';
    const mudaCpf = !cpfFicha;
    const mudaAdm = item.dataAdmissao && ficha.dataAdmissao !== item.dataAdmissao;
    const mudaNasc = item.dataNascimento && ficha.dataNascimento !== item.dataNascimento;
    return (mudaCpf || mudaAdm || mudaNasc) ? 'atualizar' : 'nada';
  }
  function seloImport(d){
    if(d.gravado) return '<span class="selo selo-ok">'+(d.acao==='criar'?'Cadastrado':(d.acao==='migrar'?'Acesso migrado':'Atualizado'))+'</span>';
    if(d.falhou) return '<span class="selo selo-erro">'+d.falhou+'</span>';
    if(d.acao==='sem-cpf') return '<span class="selo selo-erro">CPF inválido na planilha</span>';
    if(d.acao==='cpf-diferente') return '<span class="selo selo-erro">CPF diferente do cadastrado</span>';
    if(d.acao==='criar') return '<span class="selo selo-aviso">Vai cadastrar</span>';
    if(d.acao==='migrar') return '<span class="selo selo-aviso">Vai migrar o acesso</span>';
    if(d.acao==='nada') return '<span class="selo selo-ok">Já está completo</span>';
    if(d.criterio==='parecido') return '<span class="selo selo-aviso">Nome parecido, confira</span>';
    return '<span class="selo selo-ok">Vai preencher</span>';
  }
  function renderRevisaoImport(){
    const cont = document.getElementById('admin-conteudo');

      const opcoes = listaFuncionariosAdmin.map(function(f){
        return '<option value="'+f._id+'"'+(f._id===d.fichaId?' selected':'')+'>'+(f.nome||'')+'</option>';
      }).join('');

      detalhes.push(d.cpf ? formatarCPF(d.cpf) : ('CPF ilegível: '+(d.cpfBruto||'vazio')));

        (contar('sem-cpf')?(' '+contar('sem-cpf')+' sem CPF válido, ignoradas.'):'')+

        '<button class="btn btn-outline" onclick="mostrarAdminTab(\'colaboradores\')">Cancelar</button>'+
        '<button class="btn btn-azul" id="imp-btn-gravar" onclick="gravarImportacao()">Gravar selecionados</button>'+

    importAtual[i].criterio = ficha ? 'manual' : 'novo';
    importAtual[i].acao = definirAcaoImport(importAtual[i], ficha || null);

  window.gravarImportacao = async function(){
    const pendentes = importAtual.filter(function(d){ return d.incluir && !d.gravado && d.cpf; });
    const status = document.getElementById('imp-status');
    const btn = document.getElementById('imp-btn-gravar');
    status.style.color = 'var(--texto-2)';
    if(!pendentes.length){ status.style.color='var(--vermelho)'; status.textContent = 'Nenhuma linha selecionada.'; return; }
    const novos = pendentes.filter(function(d){ return d.acao==='criar'; }).length;
    const migrados = pendentes.filter(function(d){ return d.acao==='migrar'; }).length;
    let aviso = 'Gravar '+pendentes.length+' linha(s)?';
    if(novos) aviso += '\n\n'+novos+' colaborador(es) vão receber acesso novo.';
    if(migrados) aviso += '\n\n'+migrados+' acesso(s) serão migrados: a partir de agora essas pessoas entram com o PRIMEIRO NOME e o CPF, e a forma antiga deixa de funcionar. Os documentos já enviados continuam no lugar.';
    if(novos || migrados) aviso += '\n\nTodos entram com o primeiro nome e o CPF (só números) como senha.';
    if(!confirm(aviso)) return;
    btn.disabled = true;
    let ok = 0, falhas = 0;
    for(let i=0;i<pendentes.length;i++){
      const d = pendentes[i];
      status.textContent = 'Gravando '+(i+1)+' de '+pendentes.length+'...';
      try{
        const campos = { cpf: d.cpf };
        if(d.dataAdmissao) campos.dataAdmissao = d.dataAdmissao;
        if(d.dataNascimento) campos.dataNascimento = d.dataNascimento;
        if(d.acao === 'migrar'){
          // Cria o acesso novo pelo CPF preservando o funcionarioId antigo (senão os documentos
          // já enviados ficariam órfãos) e só depois apaga a ficha velha, que deixa de valer.
          const antiga = listaFuncionariosAdmin.find(function(f){ return f._id===d.fichaId; }) || {};
          const extras = Object.assign({}, campos);
          if(antiga.funcionarioId) extras.funcionarioId = antiga.funcionarioId;
          if(antiga.foto) extras.foto = antiga.foto;
          if(antiga.cargo) extras.cargo = antiga.cargo;
          if(antiga.setor) extras.setor = antiga.setor;
          if(!extras.dataAdmissao && antiga.dataAdmissao) extras.dataAdmissao = antiga.dataAdmissao;
          if(!extras.dataNascimento && antiga.dataNascimento) extras.dataNascimento = antiga.dataNascimento;
          await criarAcessoColaborador(antiga.nome || d.nome, d.cpf, extras);
          await deleteDoc(doc(dbF,'portal_funcionarios', d.fichaId));
        }
        else if(d.fichaId) await updateDoc(doc(dbF,'portal_funcionarios', d.fichaId), campos);
        else await criarAcessoColaborador(d.nome, d.cpf, campos);
        d.gravado = true;
        d.incluir = false;
        ok++;
      }catch(e){
        console.error('Falha ao gravar '+d.nome, e);
        d.falhou = (e && e.code === 'auth/email-already-in-use') ? 'Já existe acesso com esse CPF' : 'Falhou, tente de novo';
        falhas++;
      }
    }
    await carregarFuncionariosAdmin(true);
    renderRevisaoImport();
    const fim = document.getElementById('imp-status');
    fim.style.color = falhas ? 'var(--vermelho)' : 'var(--verde)';
    fim.textContent = ok+' linha(s) gravada(s).'+(falhas?(' '+falhas+' falharam.'):'');
  };

  // ===== Envio de documentos em lote =====
  // A contabilidade manda um PDF único com todo mundo dentro (um trecho por pessoa). Aqui o
  // portal lê o texto de cada página, descobre de quem é, separa em um PDF por pessoa e mostra
  // tudo para conferência. Nada é gravado antes de você confirmar.

  const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function normalizarNome(s){
    return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }
  // Distância de edição: o mesmo nome sai grafado de um jeito no holerite e de outro no ponto
  // (ALCILEA BARBOSA x ALCILÉIA BARBOZA), então a comparação precisa tolerar diferenças pequenas.
  function distanciaEdicao(a,b){
    const m = a.length, n = b.length;
    if(!m) return n;
    if(!n) return m;
    let linha = new Array(n+1);
    for(let j=0;j<=n;j++) linha[j]=j;
    for(let i=1;i<=m;i++){
      let anterior = linha[0];
      linha[0] = i;
      for(let j=1;j<=n;j++){
        const temp = linha[j];
        linha[j] = Math.min(linha[j]+1, linha[j-1]+1, anterior + (a[i-1]===b[j-1]?0:1));
        anterior = temp;
      }
    }
    return linha[n];
  }
  function semelhanca(a,b){
    if(!a || !b) return 0;
    if(a===b) return 1;
    return 1 - (distanciaEdicao(a,b) / Math.max(a.length,b.length));
  }

  // Agrupa os pedaços de texto da página em linhas pela altura, guardando o x de cada pedaço —
  // é o x que diz em qual coluna o texto está, e as colunas é que identificam o nome.
  function linhasDaPagina(itens){
    const linhas = [];
    itens.forEach(function(it){
      if(!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let linha = null;
      for(let i=0;i<linhas.length;i++){ if(Math.abs(linhas[i].y-y)<=2.5){ linha = linhas[i]; break; } }
      if(!linha){ linha = { y:y, itens:[] }; linhas.push(linha); }
      linha.itens.push({ x:x, t:it.str });
    });
    linhas.forEach(function(l){
      l.itens.sort(function(a,b){ return a.x-b.x; });
      l.texto = l.itens.map(function(i){ return i.t; }).join('').replace(/\s+/g,' ').trim();
    });
    linhas.sort(function(a,b){ return b.y-a.y; });
    return linhas;
  }
  function textoEntreColunas(linhas, iRotulo, itRotulo){
    // O rótulo seguinte na mesma linha marca onde a coluna do nome acaba (senão o Nº da folha
    // entraria junto no nome).
    const proximo = linhas[iRotulo].itens.find(function(it){ return it.x > itRotulo.x + 20; });
    const xIni = itRotulo.x - 8;
    const xFim = proximo ? proximo.x - 5 : Infinity;
    for(let i=iRotulo+1; i<linhas.length && i<=iRotulo+3; i++){
      const partes = linhas[i].itens.filter(function(it){ return it.x>=xIni && it.x<=xFim && /[A-Za-zÀ-ÿ]/.test(it.t); });
      if(partes.length) return partes.map(function(p){ return p.t; }).join('').replace(/\s+/g,' ').trim();
    }
    return '';
  }
  function lerCartaoPonto(linhas, textoTudo){
    // Ao remontar a linha, o CPF pode ficar colado na data de admissão — por isso sem \b no fim.
    const cpf = (textoTudo.match(/\d{3}\.\d{3}\.\d{3}-\d{2}/) || [])[0] || '';
    let nome = '';
    let iRotulo = -1, itRotulo = null;
    for(let i=0;i<linhas.length;i++){
      const it = linhas[i].itens.find(function(x){ return /^NOME:/i.test(x.t); });
      if(it){ iRotulo = i; itRotulo = it; break; }
    }
    if(iRotulo >= 0) nome = textoEntreColunas(linhas, iRotulo, itRotulo);
    let referencia = '';
    const periodo = textoTudo.match(/Per[íi]odo:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
    if(periodo) referencia = (MESES_NOME[Number(periodo[2])-1]||'')+' '+periodo[3];
    return { tipo:'folha_ponto', nome:nome, cpf:cpf.replace(/\D/g,''), referencia:referencia };
  }
  function lerRecibo(linhas, textoTudo){
    let nome = '';
    let iCab = -1;
    for(let i=0;i<linhas.length;i++){ if(/Nome do Funcion/i.test(linhas[i].texto)){ iCab = i; break; } }
    if(iCab >= 0){
      const cab = linhas[iCab].itens;
      const itNome = cab.find(function(it){ return /^Nome/i.test(it.t); });
      const itCbo = cab.find(function(it){ return /^CBO/i.test(it.t); });
      const xIni = itNome ? itNome.x - 5 : 45;
      const xFim = itCbo ? itCbo.x - 15 : 300;
      for(let i=iCab+1; i<linhas.length && i<=iCab+2; i++){
        const partes = linhas[i].itens.filter(function(it){ return it.x>=xIni && it.x<=xFim && /[A-Za-zÀ-ÿ]/.test(it.t); });
        if(partes.length){ nome = partes.map(function(p){ return p.t; }).join(' ').replace(/\s+/g,' ').trim(); break; }
      }
    }
    let referencia = '';
    const m = textoTudo.match(/(Janeiro|Fevereiro|Mar[çc]o|Abril|Maio|Junho|Julho|Agosto|Setembro|Outubro|Novembro|Dezembro)\s+de\s+(\d{4})/i);
    if(m) referencia = m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase()+' '+m[2];
    let tipo = 'holerite_mensal';
    if(/Folha\s*(de\s*)?F[ée]rias/i.test(textoTudo)) tipo = 'holerite_ferias';
    return { tipo:tipo, nome:nome, cpf:'', referencia:referencia };
  }
  function lerPaginaPdf(itens){
    const linhas = linhasDaPagina(itens);
    const textoTudo = linhas.map(function(l){ return l.texto; }).join('\n');
    if(/CART[ÃA]O PONTO/i.test(textoTudo)) return lerCartaoPonto(linhas, textoTudo);
    if(/Nome do Funcion/i.test(textoTudo)) return lerRecibo(linhas, textoTudo);
    return { tipo:'', nome:'', cpf:'', referencia:'' };
  }

  function vincularColaborador(dados){
    const cpfLido = (dados.cpf||'').replace(/\D/g,'');
    if(cpfLido){
      const porCpf = listaFuncionariosAdmin.find(function(f){ return String(f.cpf||'').replace(/\D/g,'') === cpfLido; });
      if(porCpf) return { ficha: porCpf, criterio: 'cpf', confianca: 1 };
    }
    const alvo = normalizarNome(dados.nome);
    if(!alvo) return { ficha: null, criterio: 'nenhum', confianca: 0 };
    const exato = listaFuncionariosAdmin.find(function(f){ return normalizarNome(f.nome) === alvo; });
    if(exato) return { ficha: exato, criterio: 'exato', confianca: 1 };
    let melhor = null, melhorNota = 0;
    listaFuncionariosAdmin.forEach(function(f){
      const nota = semelhanca(alvo, normalizarNome(f.nome));
      if(nota > melhorNota){ melhorNota = nota; melhor = f; }
    });
    if(melhor && melhorNota >= 0.82) return { ficha: melhor, criterio: 'parecido', confianca: melhorNota };
    return { ficha: null, criterio: 'nenhum', confianca: melhorNota };
  }

  function bytesParaBase64(bytes){
    let binario = '';
    const pedaco = 0x8000;
    for(let i=0; i<bytes.length; i+=pedaco){
      binario += String.fromCharCode.apply(null, bytes.subarray(i, i+pedaco));
    }
    return btoa(binario);
  }

  window.abrirLoteDocumentos = function(){
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>Envio em lote</h3><button class="icon-btn escuro" onclick="fecharModal()">'+icone('fechar')+'</button></div>'+
      '<p style="color:var(--texto-2);font-size:.83rem;line-height:1.6;margin:0 0 1.1rem">Escolha o PDF que veio da contabilidade (holerites ou cartão ponto, com vários colaboradores dentro). O portal separa por pessoa e mostra tudo para você conferir antes de enviar.</p>'+
      '<label>Arquivos PDF</label><input type="file" id="f-lote-arquivos" accept="application/pdf" multiple>'+
      '<div class="erro" id="f-lote-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="processarLote()">Ler arquivos</button>';
    document.getElementById('modal-overlay').classList.add('aberto');
  };

  window.processarLote = async function(){
    const arquivos = Array.prototype.slice.call(document.getElementById('f-lote-arquivos').files || []);
    const erroEl = document.getElementById('f-lote-erro');
    erroEl.style.color = 'var(--vermelho)';
    if(!arquivos.length){ erroEl.textContent = 'Escolha pelo menos um arquivo.'; return; }
    if(!window.PDFLib){ erroEl.textContent = 'O componente de separação de PDF não carregou. Verifique a internet e recarregue a página.'; return; }
    fecharModal();
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio" id="lote-progresso">Lendo arquivos...</div>';
    const progresso = document.getElementById('lote-progresso');
    try{
      await carregarFuncionariosAdmin(true);
      const encontrados = [];
      for(let a=0; a<arquivos.length; a++){
        const buffer = await arquivos[a].arrayBuffer();
        // pdf.js pode transferir o buffer para o worker dele, então cada biblioteca recebe a sua cópia.
        const pdf = await pdfjsLib.getDocument({ data: buffer.slice(0) }).promise;
        const origem = await PDFLib.PDFDocument.load(buffer.slice(0), { ignoreEncryption:true });
        const paginas = [];
        for(let p=1; p<=pdf.numPages; p++){
          progresso.textContent = 'Lendo '+arquivos[a].name+' — página '+p+' de '+pdf.numPages+'...';
          const conteudo = await (await pdf.getPage(p)).getTextContent();
          paginas.push(lerPaginaPdf(conteudo.items));
        }
        // Páginas seguidas da mesma pessoa são um documento só (recibo com "A TRANSPORTAR"
        // ocupa duas páginas).
        const grupos = [];
        paginas.forEach(function(dados, idx){
          const anterior = grupos[grupos.length-1];
          if(anterior && dados.nome && anterior.nome === dados.nome && anterior.tipo === dados.tipo) anterior.paginas.push(idx);
          else grupos.push({ nome:dados.nome, cpf:dados.cpf, tipo:dados.tipo, referencia:dados.referencia, paginas:[idx] });
        });
        for(let g=0; g<grupos.length; g++){
          progresso.textContent = 'Separando '+arquivos[a].name+' — documento '+(g+1)+' de '+grupos.length+'...';
          const grupo = grupos[g];
          const novo = await PDFLib.PDFDocument.create();
          const copiadas = await novo.copyPages(origem, grupo.paginas);
          copiadas.forEach(function(pg){ novo.addPage(pg); });
          const bytes = await novo.save();
          const vinculo = vincularColaborador(grupo);
          encontrados.push({
            nomeLido: grupo.nome,
            cpfLido: grupo.cpf,
            tipo: grupo.tipo || 'holerite_mensal',
            referencia: grupo.referencia,
            base64: bytesParaBase64(bytes),
            tamanho: bytes.length,
            arquivo: arquivos[a].name,
            paginas: grupo.paginas.length,
            fichaId: vinculo.ficha ? vinculo.ficha._id : '',
            funcionarioId: vinculo.ficha ? (vinculo.ficha.funcionarioId||'') : '',
            criterio: vinculo.criterio,
            incluir: !!vinculo.ficha,
            enviado: false,
            falhou: ''
          });
        }
      }
      loteAtual = encontrados;
      await marcarJaEnviados();
      renderRevisaoLote();
    }catch(e){
      console.error(e);
      cont.innerHTML = '<div class="vazio">Não foi possível ler esse arquivo. Confira se é um PDF gerado pelo sistema (não uma digitalização).</div>'+
        '<button class="btn btn-outline btn-full" style="margin-top:1rem" onclick="mostrarAdminTab(\'documentos\')">Voltar</button>';
    }
  };

  // Evita mandar duas vezes o mesmo mês: procura o que já existe para as referências deste lote.
  async function marcarJaEnviados(){
    const combinacoes = {};
    loteAtual.forEach(function(d){ if(d.referencia && d.tipo) combinacoes[d.tipo+'|'+d.referencia] = true; });
    for(const chave of Object.keys(combinacoes)){
      const partes = chave.split('|');
      try{
        const snap = await getDocs(query(collection(dbF,'portal_documentos'),
          where('tipo','==',partes[0]), where('referencia','==',partes[1])));
        const jaTem = {};
        snap.forEach(function(d){ jaTem[d.data().funcionarioId] = true; });
        loteAtual.forEach(function(d){
          if(d.tipo===partes[0] && d.referencia===partes[1] && d.funcionarioId && jaTem[d.funcionarioId]){
            d.duplicado = true;
            d.incluir = false;
          }
        });
      }catch(e){ console.warn('Não foi possível checar duplicados de '+chave, e); }
    }
  }

  function selosDoItem(d){
    if(d.enviado) return '<span class="selo selo-ok">Enviado</span>';
    if(d.falhou) return '<span class="selo selo-erro">'+d.falhou+'</span>';
    if(!d.fichaId) return '<span class="selo selo-erro">Escolha o colaborador</span>';
    if(d.duplicado) return '<span class="selo selo-aviso">Já existe para este mês</span>';
    if(d.criterio==='cpf') return '<span class="selo selo-ok">Vinculado pelo CPF</span>';
    if(d.criterio==='exato') return '<span class="selo selo-ok">Nome confere</span>';
    if(d.criterio==='parecido') return '<span class="selo selo-aviso">Nome parecido, confira</span>';
    return '';
  }
  function renderRevisaoLote(){
    const cont = document.getElementById('admin-conteudo');
    const opcoesTipo = Object.keys(TIPOS).map(function(k){ return '<option value="'+k+'">'+TIPOS[k]+'</option>'; }).join('');
    const linhas = loteAtual.map(function(d, i){
      const opcoesFunc = listaFuncionariosAdmin.map(function(f){
        return '<option value="'+f._id+'"'+(f._id===d.fichaId?' selected':'')+'>'+(f.nome||'')+'</option>';
      }).join('');
      return '<div class="lote-item'+(d.incluir?'':' apagado')+'" id="lote-item-'+i+'">'+
        '<div class="lote-topo">'+
          '<label class="checkbox-linha" style="margin:0">'+
            '<input type="checkbox" '+(d.incluir?'checked':'')+' onchange="alternarItemLote('+i+',this.checked)">'+
            '<span>'+(d.nomeLido||'(nome não encontrado)')+'</span>'+
          '</label>'+
          selosDoItem(d)+
        '</div>'+
        '<div class="lote-campos">'+
          '<div><label>Colaborador</label><select onchange="definirFichaLote('+i+',this.value)"><option value="">Selecione...</option>'+opcoesFunc+'</select></div>'+
          '<div><label>Referência</label><input value="'+valorAttr(d.referencia)+'" oninput="definirReferenciaLote('+i+',this.value)"></div>'+
        '</div>'+
        '<div class="lote-rodape">'+(TIPOS[d.tipo]||d.tipo)+' · '+d.paginas+(d.paginas===1?' página':' páginas')+' · '+Math.round(d.tamanho/1024)+' KB</div>'+
      '</div>';
    }).join('');
    const semVinculo = loteAtual.filter(function(d){ return !d.fichaId; }).length;
    const duplicados = loteAtual.filter(function(d){ return d.duplicado; }).length;
    cont.innerHTML =
      '<h3 style="margin-bottom:.5rem">Conferir antes de enviar</h3>'+
      '<p style="color:var(--texto-2);font-size:.83rem;line-height:1.6;margin:0 0 1rem">'+
        loteAtual.length+' documentos encontrados.'+
        (semVinculo?(' <strong>'+semVinculo+' sem colaborador vinculado</strong> — escolha na lista ou desmarque.'):'')+
        (duplicados?(' '+duplicados+' já existem para o mês e vieram desmarcados.'):'')+
      '</p>'+
      '<div class="form-linha2" style="margin-bottom:1rem">'+
        '<div><label>Aplicar categoria a todos</label><select id="lote-tipo-geral">'+opcoesTipo+'</select></div>'+
        '<div><label>&nbsp;</label><button class="btn btn-outline btn-full" onclick="aplicarTipoLote()">Aplicar</button></div>'+
      '</div>'+
      '<label>Liberar em (opcional, vale para todo o lote)</label>'+
      '<p class="dica-campo">Em branco, todos ficam disponíveis assim que você enviar. Com data e hora, o lote inteiro só aparece para os colaboradores a partir desse momento.</p>'+
      '<input type="datetime-local" id="lote-liberar" value="'+valorAttr(loteLiberarEm)+'" onchange="loteLiberarEm=this.value">'+
      /* assinatura desligada: caixa de pedir assinatura no lote */
      '<div id="lote-lista">'+linhas+'</div>'+
      '<div class="lote-acoes">'+
        '<button class="btn btn-outline" onclick="mostrarAdminTab(\'documentos\')">Cancelar</button>'+
        '<button class="btn btn-azul" id="lote-btn-enviar" onclick="enviarLote()">Enviar selecionados</button>'+
      '</div>'+
      '<div class="erro" id="lote-status" style="margin-top:.8rem"></div>';
    const seletorTipo = document.getElementById('lote-tipo-geral');
    if(loteAtual.length && seletorTipo) seletorTipo.value = loteAtual[0].tipo;
  }
  window.alternarItemLote = function(i, marcado){
    loteAtual[i].incluir = marcado;
    const el = document.getElementById('lote-item-'+i);
    if(el) el.classList.toggle('apagado', !marcado);
  };
  window.definirFichaLote = function(i, fichaId){
    const ficha = listaFuncionariosAdmin.find(function(f){ return f._id===fichaId; });
    loteAtual[i].fichaId = fichaId;
    loteAtual[i].funcionarioId = ficha ? (ficha.funcionarioId||'') : '';
    loteAtual[i].criterio = ficha ? 'manual' : 'nenhum';
    if(ficha) loteAtual[i].incluir = true;
    renderRevisaoLote();
  };
  window.definirReferenciaLote = function(i, valor){ loteAtual[i].referencia = valor.trim(); };
  window.aplicarTipoLote = function(){
    const tipo = document.getElementById('lote-tipo-geral').value;
    loteAtual.forEach(function(d){ if(!d.enviado) d.tipo = tipo; });
    renderRevisaoLote();
  };

  window.enviarLote = async function(){
    const pendentes = loteAtual.filter(function(d){ return d.incluir && !d.enviado; });
    const status = document.getElementById('lote-status');
    const btn = document.getElementById('lote-btn-enviar');
    status.style.color = 'var(--texto-2)';
    if(!pendentes.length){ status.style.color='var(--vermelho)'; status.textContent = 'Nenhum documento selecionado.'; return; }
    const semFicha = pendentes.filter(function(d){ return !d.funcionarioId; });
    if(semFicha.length){ status.style.color='var(--vermelho)'; status.textContent = semFicha.length+' documento(s) selecionado(s) estão sem colaborador. Escolha ou desmarque.'; return; }
    const quando = loteLiberarEm
      ? ('Os documentos só aparecerão para os colaboradores a partir de '+formatarDataHoraBR(new Date(loteLiberarEm).toISOString())+'.')
      : 'Cada colaborador passa a ver o dele no portal imediatamente.';
    if(!confirm('Enviar '+pendentes.length+' documento(s)?\n\n'+quando)) return;
    btn.disabled = true;
    let enviados = 0, falhas = 0;
    for(let i=0;i<pendentes.length;i++){
      const d = pendentes[i];
      status.textContent = 'Enviando '+(i+1)+' de '+pendentes.length+'...';
      try{
        const registro = {
          funcionarioId: d.funcionarioId, tipo: d.tipo, referencia: d.referencia,
          nomeArquivo: (d.nomeLido||'documento')+' - '+d.referencia,
          enviadoEm: new Date().toISOString()
        };
        if(loteLiberarEm) registro.liberarEm = new Date(loteLiberarEm).toISOString();
        // assinatura desligada
        await gravarDocumentoComArquivo(registro, d.base64);
        d.enviado = true;
        d.incluir = false;
        enviados++;
      }catch(e){
        console.error('Falha ao enviar documento de '+d.nomeLido, e);
        d.falhou = 'Falhou, tente de novo';
        falhas++;
      }
    }
    renderRevisaoLote();
    const statusFinal = document.getElementById('lote-status');
    statusFinal.style.color = falhas ? 'var(--vermelho)' : 'var(--verde)';
    statusFinal.textContent = enviados+' documento(s) enviado(s).'+(falhas?(' '+falhas+' falharam — os que falharam continuam marcados na lista.'):'');
    if(falhas) loteAtual.forEach(function(d){ if(d.falhou) d.incluir = true; });
  };

  // Nem todo mundo vai assinar pelo celular. Aqui o Administrativo registra que a pessoa
  // assinou no papel, para a lista de pendências refletir a realidade.
  window.marcarAssinaturaFisica = async function(i){
    const d = docsAdminLista[i];
    if(!d) return;
    const ficha = listaFuncionariosAdmin.find(function(f){ return f.funcionarioId===d.funcionarioId; }) || {};
    if(!confirm('Marcar que '+(ficha.nome||'o colaborador')+' já assinou este documento no papel?\n\nServe para tirar da lista de pendentes. A via assinada continua sendo a de papel.\n\n'+(TIPOS[d.tipo]||d.tipo)+' · '+(d.referencia||''))) return;
    try{
      // Só marcação de controle: sem data de assinatura, porque quem assinou no papel
      // pode ter assinado em outro dia. Guardamos apenas quando e quem fez a marcação.
      const registro = {
        funcionarioId: d.funcionarioId,
        nome: ficha.nome || '',
        documentoId: d._id,
        tipo: d.tipo,
        referencia: d.referencia || '',
        metodo: 'fisico',
        marcadoPor: (auth.currentUser && auth.currentUser.email) || '',
        marcadoEm: new Date().toISOString()
      };
      await setDoc(doc(dbF,'portal_assinaturas', d._id), registro);
      assinaturasAdmin[d._id] = registro;
      await recarregarDocsAdmin();
    }catch(e){
      console.error(e);
      alert('Não foi possível registrar agora.');
    }
  };
  window.desfazerAssinaturaFisica = async function(docId){
    if(!confirm('Desfazer a marcação de assinatura no papel?')) return;
    try{
      await deleteDoc(doc(dbF,'portal_assinaturas', docId));
      delete assinaturasAdmin[docId];
      await recarregarDocsAdmin();
    }catch(e){ alert('Não foi possível desfazer agora.'); }
  };

  // O arquivo assinado contém o mesmo conteúdo do original, então guardar os dois é
  // desperdício de espaço. Aqui o original é apagado e o documento passa a abrir o assinado.
  window.descartarOriginal = async function(docId){
    if(!confirm('Apagar o arquivo original deste documento?\n\nO PDF assinado no gov.br continua guardado e passa a ser o documento que abre no portal. Serve para economizar espaço.')) return;
    try{
      await deleteDoc(doc(dbF,'portal_arquivos', docId));
      await updateDoc(doc(dbF,'portal_documentos', docId), { originalDescartado: true });
      await recarregarDocsAdmin();
    }catch(e){
      console.error(e);
      alert('Não foi possível apagar agora.');
    }
  };

  // Abre o PDF que voltou assinado pelo gov.br.
  window.verArquivoAssinado = async function(docId){
    const a = assinaturasAdmin[docId] || {};
    const titulo = (TIPOS[a.tipo]||a.tipo||'Documento')+' · assinado no gov.br';
    abrirVisualizadorPdf('', titulo);
    try{
      const snap = await getDoc(doc(dbF,'portal_arquivos_assinados', docId));
      if(!snap.exists()){ alert('Arquivo assinado não encontrado.'); return; }
      return abrirVisualizadorPdf(snap.data().base64 || '', titulo);
    }catch(e){ alert('Não foi possível abrir o arquivo assinado.'); }
  };

  // Comprovante da assinatura: serve como anexo em caso de questionamento.
  window.verComprovanteAssinatura = function(docId){
    const a = assinaturasAdmin[docId];
    if(!a) return;
    abrirFolhaImpressao({
      rotulo: 'Comprovante de assinatura eletrônica',
      titulo: (TIPOS[a.tipo]||a.tipo)+' · '+(a.referencia||''),
      subtitulo: 'Assinado por '+(a.nome||'')+(a.cpf?(' · CPF '+formatarCPF(a.cpf)):'')+' em '+formatarDataHoraBR(a.assinadoEm)+'.',
      texto:
        (a.metodo==='gov'
          ? ('Documento assinado pelo colaborador no assinador oficial do gov.br e devolvido pelo Portal do Colaborador.\nArquivo assinado: '+(a.nomeArquivoAssinado||'')+'\n\n')
          : a.metodo==='fisico'
          ? ('Documento assinado em papel. Registro feito no Portal do Colaborador por '+(a.registradoPor||'')+'.\nA via assinada fica arquivada na empresa.\n\n')
          : 'Assinatura eletrônica simples registrada no Portal do Colaborador.\n\n')+
        (a.metodo==='fisico' ? '' :
          ('Aparelho utilizado: '+(a.sistema||'')+' · '+(a.navegador||'')+' · '+(a.comoAbriu||'')+'\n\n'+
           'Impressão digital do arquivo assinado (SHA-256):\n'+(a.impressaoDigital||'')+'\n\n'+
           'Esta impressão identifica de forma única o arquivo no momento da assinatura. '+
           'Se o documento for alterado depois, a impressão deixa de corresponder.'))
    });
  };
  window.recarregarDocsAdmin = async function(){
    const cont = document.getElementById('doc-admin-lista');
    if(!cont) return;
    if(!docAdminFuncionarioId){ cont.innerHTML = '<div class="vazio">Selecione um funcionário para ver os documentos.</div>'; return; }
    cont.innerHTML = '<div class="vazio">Carregando...</div>';
    const q = query(collection(dbF,'portal_documentos'), where('funcionarioId','==',docAdminFuncionarioId));
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(function(d){ docs.push(Object.assign({_id:d.id}, d.data())); });
    if(!docs.length){ cont.innerHTML = '<div class="vazio">Nenhum documento para este funcionário.</div>'; return; }
    docs.sort(function(a,b){ return (b.enviadoEm||'').localeCompare(a.enviadoEm||''); });
    // Guardado para o botão Ver abrir o PDF sem precisar buscar de novo.
    docsAdminLista = docs;
    // Quem já assinou, para a lista mostrar o que ainda falta.
    assinaturasAdmin = {};
    try{
      if(!TIPOS_ASSINAVEIS.length) throw new Error('assinatura desligada');
      const snapA = await getDocs(query(collection(dbF,'portal_assinaturas'), where('funcionarioId','==', docAdminFuncionarioId)));
      snapA.forEach(function(a){ assinaturasAdmin[a.id] = a.data(); });
    }catch(e){ if(TIPOS_ASSINAVEIS.length) console.warn('Não foi possível ler as assinaturas', e); }
    cont.innerHTML = docs.map(function(d, i){
      const agendado = d.liberarEm && d.liberarEm > new Date().toISOString();
      const ass = assinaturasAdmin[d._id];
      const situacaoAssinatura = ass
        ? (' · <span style="color:var(--verde);font-weight:700">'+comoFoiAssinado(ass)+(ass.metodo==='fisico'?'':(' em '+formatarDataHoraBR(ass.assinadoEm)))+'</span>')
        : ((d.pedeAssinatura && podeAssinar(d.tipo)) ? ' · <span style="color:#8a5a00;font-weight:700">Assinatura pendente</span>' : '');
      const marcaOriginal = d.originalDescartado ? ' · <span style="color:var(--texto-3)">só o assinado</span>' : '';
      return '<div class="admin-lista-item"><div class="info"><h5>'+(d.referencia||'')+'</h5><small>'+(TIPOS[d.tipo]||d.tipo)+(agendado?(' · <span style="color:#8a5a00;font-weight:700">Liberado em '+formatarDataHoraBR(d.liberarEm)+'</span>'):'')+situacaoAssinatura+marcaOriginal+'</small></div>'+
        '<div class="btns">'+
          '<button class="btn btn-outline btn-sm" onclick="verDocumentoAdmin('+i+')">Ver</button>'+
          ((assinaturasAdmin[d._id]&&assinaturasAdmin[d._id].metodo!=='fisico')?('<button class="btn btn-outline btn-sm" onclick="verComprovanteAssinatura(\''+d._id+'\')">Comprovante</button>'):'')+
          ((d.pedeAssinatura && podeAssinar(d.tipo) && !assinaturasAdmin[d._id])?('<button class="btn btn-outline btn-sm" onclick="marcarAssinaturaFisica('+i+')">Assinou fisicamente</button>'):'')+
          ((assinaturasAdmin[d._id]&&assinaturasAdmin[d._id].metodo==='fisico')?('<button class="btn-icon perigo" title="Desfazer marcação" onclick="desfazerAssinaturaFisica(\''+d._id+'\')">'+icone('excluir')+'</button>'):'')+
          ((assinaturasAdmin[d._id]&&assinaturasAdmin[d._id].metodo==='gov')?('<button class="btn btn-outline btn-sm" onclick="verArquivoAssinado(\''+d._id+'\')">PDF assinado</button>'):'')+
          ((assinaturasAdmin[d._id]&&assinaturasAdmin[d._id].metodo==='gov'&&!d.originalDescartado)?('<button class="btn btn-outline btn-sm" onclick="descartarOriginal(\''+d._id+'\')">Descartar original</button>'):'')+
          '<button class="btn-icon perigo" onclick="excluirDocumentoAdmin(\''+d._id+'\')">'+icone('excluir')+'</button>'+
        '</div></div>';
    }).join('');
  };
  window.abrirFormDocumento = function(){
    if(!docAdminFuncionarioId){ alert('Selecione um funcionário primeiro.'); return; }
    const opcoesTipo = Object.keys(TIPOS).map(function(k){ return '<option value="'+k+'">'+TIPOS[k]+'</option>'; }).join('');
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>Novo documento</h3><button class="icon-btn escuro" onclick="fecharModal()">'+icone('fechar')+'</button></div>'+
      '<label>Categoria</label><select id="f-doc-tipo">'+opcoesTipo+'</select>'+
      '<label>Referência (ex: Janeiro 2026)</label><input id="f-doc-ref">'+
      '<label>Arquivo (PDF)</label><input type="file" id="f-doc-arquivo" accept="application/pdf">'+
      '<label>Liberar em (opcional)</label>'+
      '<p class="dica-campo">Deixe em branco para liberar na hora. Com data e hora preenchidas, o documento só aparece para o colaborador a partir desse momento.</p>'+
      '<input type="datetime-local" id="f-doc-liberar">'+
      /* assinatura desligada: '<label class="checkbox-linha"><input type="checkbox" id="f-doc-assinatura"> Pedir assinatura do colaborador</label>'+ */
      '<div class="erro" id="f-doc-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="salvarDocumentoAdmin()">Salvar documento</button>';
    document.getElementById('modal-overlay').classList.add('aberto');
  };
  window.salvarDocumentoAdmin = async function(){
    const tipo = document.getElementById('f-doc-tipo').value;
    const referencia = document.getElementById('f-doc-ref').value.trim();
    const arquivoInput = document.getElementById('f-doc-arquivo');
    const erroEl = document.getElementById('f-doc-erro');
    erroEl.textContent = '';
    if(!referencia || !arquivoInput.files[0]){ erroEl.textContent='Preencha a referência e escolha um arquivo.'; return; }
    try{
      const base64 = await arquivoParaBase64(arquivoInput.files[0]);
      const dados = {
        funcionarioId: docAdminFuncionarioId, tipo: tipo, referencia: referencia,
        nomeArquivo: arquivoInput.files[0].name, enviadoEm: new Date().toISOString()
      };
      const liberar = document.getElementById('f-doc-liberar').value;
      if(liberar) dados.liberarEm = new Date(liberar).toISOString();
      // assinatura desligada — nada é marcado como pendente de assinatura
      await gravarDocumentoComArquivo(dados, base64);
      fecharModal();
      recarregarDocsAdmin();
    }catch(e){ erroEl.textContent='Não foi possível salvar o documento agora.'; }
  };

  // A ficha do documento (mês, categoria, dono) e o PDF ficam separados: a ficha é lida no
  // login de todo mundo, o arquivo só quando alguém abre. Os dois compartilham o mesmo id.
  async function gravarDocumentoComArquivo(ficha, base64){
    const criado = await addDoc(collection(dbF,'portal_documentos'), ficha);
    try{
      await setDoc(doc(dbF,'portal_arquivos', criado.id), {
        funcionarioId: ficha.funcionarioId, base64: base64
      });
    }catch(e){
      // Sem o arquivo a ficha não serve de nada, então desfaz para não deixar lixo.
      try{ await deleteDoc(doc(dbF,'portal_documentos', criado.id)); }catch(e2){}
      throw e;
    }
    return criado.id;
  }
  async function excluirDocumentoComArquivo(id){
    await deleteDoc(doc(dbF,'portal_documentos', id));
    try{ await deleteDoc(doc(dbF,'portal_arquivos', id)); }catch(e){}
  }
  window.excluirDocumentoAdmin = function(id){
    if(!confirm('Excluir este documento? Esta ação não pode ser desfeita.')) return;
    excluirDocumentoComArquivo(id)
      .then(function(){ recarregarDocsAdmin(); })
      .catch(function(){ alert('Não foi possível excluir agora.'); });
  };

  window.excluirItem = function(colName, id, reloadFnName){
    if(!confirm('Excluir este item? Esta ação não pode ser desfeita.')) return;
    deleteDoc(doc(dbF,colName,id)).then(function(){
      if(reloadFnName && window[reloadFnName]) window[reloadFnName]();
    }).catch(function(){ alert('Não foi possível excluir agora.'); });
  };

  // ===== Ciclo de autenticação =====
  onAuthStateChanged(auth, async function(user){
    if(!user){
      if(pararEscutaDuvidas){ pararEscutaDuvidas(); pararEscutaDuvidas = null; }
      document.getElementById('tela-login').style.display = '';
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('admin-shell').classList.remove('aberta');
      return;
    }
    document.getElementById('tela-login').style.display = 'none';

    // Quem entra com e-mail de verdade é administrador. Colaborador entra com nome e CPF, que
    // o portal transforma num e-mail interno — esse nunca vira administrador, mesmo que a ficha
    // dele tenha sido excluída (senão, excluir um colaborador daria acesso ao painel a ele).
    if(!ehLoginDeColaborador(user.email)){
      modoAdminPuro = true;
      perfilAtual = { nome: user.email };
      funcionarioIdAtual = '';
      document.getElementById('app-shell').style.display = 'none';
      await Promise.allSettled([carregarBeneficios(), carregarTreinamentos(), carregarComunicados()]);
      abrirAdmin();
      escutarDuvidasAdmin();
      return;
    }

    let perfilSnap;
    try{ perfilSnap = await getDoc(doc(dbF,'portal_funcionarios', user.uid)); }
    catch(e){
      document.getElementById('app-shell').style.display = '';
      document.getElementById('view-dashboard').innerHTML = '<div class="vazio">Não foi possível carregar seus dados agora. Tente novamente em instantes.</div>';
      return;
    }
    if(!perfilSnap.exists()){
      document.getElementById('tela-login').style.display = '';
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('login-erro').textContent = 'Seu acesso não está mais ativo. Procure o RH.';
      nomeDigitadoLogin = '';
      await signOut(auth);
      return;
    }
    // A conta é achada pelo CPF, então o nome digitado precisa ser conferido aqui: sem isso,
    // qualquer nome funcionaria desde que o CPF estivesse certo.
    if(nomeDigitadoLogin){
      const digitado = normalizar(primeiroNome(nomeDigitadoLogin));
      const cadastrado = normalizar(primeiroNome(perfilSnap.data().nome));
      nomeDigitadoLogin = '';
      if(digitado !== cadastrado){
        document.getElementById('tela-login').style.display = '';
        document.getElementById('app-shell').style.display = 'none';
        document.getElementById('login-erro').textContent = 'Nome ou CPF incorretos.';
        await signOut(auth);
        return;
      }
    }
    document.getElementById('app-shell').style.display = '';
    perfilAtual = perfilSnap.data();
    funcionarioIdAtual = perfilAtual.funcionarioId;
    guardarNomeNoAparelho(primeiroNome(perfilAtual.nome));
    const falhas = await carregarTudo();
    escutarMinhasDuvidas();
    await carregarTermo();
    if(!(await jaAceitouTermo())){ mostrarTelaTermo(); }
    tentarRenderizar(renderDashboard, 'dashboard');
    tentarRenderizar(renderDocumentosView, 'documentos');
    tentarRenderizar(renderBeneficiosView, 'benefícios');
    tentarRenderizar(renderTreinamentosView, 'treinamentos');
    tentarRenderizar(renderComunicadosView, 'comunicados');
    tentarRenderizar(renderFaqView, 'perguntas frequentes');
    tentarRenderizar(renderPerfilView, 'perfil');
    mostrarView('dashboard');
    if(falhas.length){
      const aviso = document.getElementById('view-dashboard');
      aviso.insertAdjacentHTML('afterbegin', '<div class="erro" style="margin-bottom:1rem">Algumas informações não carregaram agora ('+falhas.join(', ')+'). Tente sair e entrar de novo em instantes — se continuar, avise o Administrativo.</div>');
    }
  });
  function tentarRenderizar(fn, nome){
    try{ fn(); }catch(e){ console.error('Erro ao renderizar '+nome+':', e); }
  }
</script>
</body>
</html>
