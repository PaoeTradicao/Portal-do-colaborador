<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do Colaborador · Pão & Tradição</title>
<meta name="theme-color" content="#13215E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192-maskable.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192-maskable.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#13215E; --azul-2:#1c2f7a; --ouro:#EFAD4C; --ouro-claro:#FBF3E8;
    --creme:#F5F0DC; --texto-2:#5B7184; --texto-3:#8b95a8;
    --superficie:#ffffff; --superficie-2:#F5F4F0; --linha:#F0EFEA; --campo:#fcfbf7;
    --borda:var(--linha); --borda-forte:#d8d3c0;
    --verde:#1D9E75; --vermelho:#C0392B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--superficie);color:var(--azul);min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;color:var(--azul);font-weight:700}
  a{color:inherit}
  .hidden{display:none!important}

  .topo-marca{background:var(--azul);padding:1.1rem 1.2rem;text-align:center;position:relative;overflow:hidden;padding-top:max(1.1rem, env(safe-area-inset-top))}
  .topo-marca::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,var(--ouro),var(--ouro-claro),var(--ouro))}
  .topo-marca h1{color:var(--superficie);font-size:1.1rem;font-weight:800;letter-spacing:.02em}
  .topo-marca .sub{color:var(--ouro);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

  .wrap{max-width:520px;margin:0 auto;padding:1.6rem 1.1rem 3rem}
  .app-body{padding-top:1.2rem;padding-bottom:5.4rem}

  .card{background:var(--superficie);border-radius:16px;padding:1.4rem;box-shadow:0 1px 3px rgba(19,33,94,.06);margin-bottom:1.1rem}

  label{display:block;font-size:.72rem;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
  input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--borda-forte);border-radius:9px;font-size:16px;margin-bottom:1.1rem;font-family:inherit;color:var(--azul);background:var(--campo);transition:border-color .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ouro);background:var(--superficie)}
  textarea{min-height:90px;resize:vertical}
  input[type="checkbox"]{width:auto;margin:0}

  .btn{padding:9px 17px;border:none;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:background .15s}
  .btn-azul{background:var(--azul);color:var(--superficie)}
  .btn-azul:hover{background:var(--azul-2)}
  .btn-outline{background:var(--superficie);border:1px solid var(--borda-forte);color:var(--azul)}
  .btn-outline:hover{background:var(--ouro-claro)}
  .btn-sm{padding:6px 12px;font-size:.76rem}
  .btn-full{width:100%}

  .campo-senha{position:relative}
  .campo-senha input{padding-right:46px}
  .ver-senha{position:absolute;right:5px;top:6px;background:transparent;border:none;color:var(--texto-2);padding:6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ver-senha:hover{color:var(--azul);background:var(--superficie-2)}
  .ver-senha svg{width:19px;height:19px}

  .conversa{display:flex;flex-direction:column;gap:.55rem;max-height:45vh;overflow-y:auto;padding:.2rem}
  .balao{max-width:85%;padding:.6rem .8rem;border-radius:14px;font-size:.86rem;line-height:1.5}
  .balao.meu{align-self:flex-end;background:var(--azul);color:var(--superficie);border-bottom-right-radius:4px}
  .balao.outro{align-self:flex-start;background:var(--superficie-2);color:var(--azul);border-bottom-left-radius:4px}
  .balao-ref{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;margin-bottom:.25rem}
  .balao-texto{white-space:pre-wrap}
  .balao-hora{font-size:.68rem;opacity:.7;margin-top:.3rem}

  .faq-pergunta{border-bottom:1px solid var(--linha)}
  .faq-pergunta:last-of-type{border-bottom:none}
  .faq-pergunta-topo{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem .1rem;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--texto-2)}
  .faq-pergunta-topo svg{width:16px;height:16px;color:var(--texto-3);flex-shrink:0;transition:transform .15s}
  .faq-pergunta-topo.aberto svg{transform:rotate(90deg)}
  .faq-pergunta-topo.aberto{color:var(--azul);font-weight:800}
  .faq-pergunta-corpo{display:none;padding:0 .1rem .8rem}
  .faq-pergunta-corpo.aberto{display:block}
  .barra-nota{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
  .barra-nota .rot{width:12px;font-size:.78rem;font-weight:800;color:var(--azul)}
  .barra-nota .trilho{flex:1;height:8px;background:var(--linha);border-radius:6px;overflow:hidden}
  .barra-nota .preenchida{display:block;height:100%;background:var(--ouro);border-radius:6px}
  .barra-nota .qtd{width:22px;text-align:right;font-size:.75rem;color:var(--texto-2)}

  .cartao-topo{display:flex;align-items:center;justify-content:space-between;gap:.8rem;cursor:pointer}
  .cartao-seta{display:flex;color:var(--texto-3)}
  .cartao-seta svg{width:17px;height:17px;transition:transform .15s}
  .cartao-seta.aberta svg{transform:rotate(90deg)}

  .linha-chave{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .chave{width:48px;height:28px;border-radius:20px;border:none;background:var(--linha);position:relative;cursor:pointer;flex-shrink:0;padding:0;transition:background .18s}
  .chave .bolinha{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--superficie);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
  .chave.ligada{background:var(--ouro)}
  .chave.ligada .bolinha{transform:translateX(20px)}

  .estrelas{display:flex;gap:.3rem}
  .estrela{background:transparent;border:none;padding:.2rem;cursor:pointer;color:var(--linha);line-height:0}
  .estrela svg{width:30px;height:30px}
  .estrela.cheia{color:var(--ouro)}

  .faq-assunto{background:var(--superficie);border-radius:14px;padding:.2rem .9rem;margin-bottom:.6rem;box-shadow:0 1px 3px rgba(19,33,94,.05)}
  .faq-assunto .grupo-ano-cabecalho{font-size:.95rem;font-weight:800;border-bottom:none;padding:.85rem 0}
  .faq-assunto .grupo-ano-cabecalho.aberto{border-bottom:1px solid var(--linha)}
  .faq-links{display:flex;flex-direction:column}
  .faq-links a{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem .1rem;font-size:.82rem;font-weight:500;color:var(--texto-2);text-decoration:none;border-bottom:1px solid var(--superficie-2)}
  .faq-links a:last-child{border-bottom:none}
  .faq-links a svg{width:15px;height:15px;color:var(--texto-3);flex-shrink:0}

  .faq-nao-resolveu{display:block;margin:.5rem auto .2rem;background:transparent;border:none;padding:.5rem;color:var(--texto-3);font-weight:600;font-size:.78rem;font-family:inherit;cursor:pointer;text-decoration:underline}

  .faq-secao{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8a5a00;margin:.9rem 0 .3rem}
  .faq-secao:first-child{margin-top:0}
  .faq-texto{white-space:pre-wrap;font-size:.87rem;line-height:1.65;color:var(--texto-2)}
  .faq-texto a{color:var(--azul);font-weight:600;word-break:break-all}

  .dica-campo{font-size:.75rem;color:var(--texto-2);line-height:1.5;margin:-.5rem 0 .5rem}

  .erro{color:var(--vermelho);font-size:.83rem;margin-bottom:.7rem;min-height:1rem;font-weight:500}
  .login-hint{font-size:.78rem;color:var(--texto-2);text-align:center;margin-top:.9rem;line-height:1.5}
  .link-alternar{display:block;width:100%;background:transparent;border:none;color:var(--texto-2);font-size:.78rem;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-top:.9rem;padding:0;font-family:inherit}
  .link-alternar:hover{color:var(--azul)}

  .doc-tipo{font-size:.74rem;font-weight:800;color:var(--ouro);margin:1.2rem 0 .6rem;text-transform:uppercase;letter-spacing:.06em}
  .doc-tipo:first-child{margin-top:0}
  .passos-gov{padding-left:1.15rem;margin:0 0 .6rem;font-size:.86rem;line-height:1.6;color:var(--texto-2)}
  .passos-gov li{margin-bottom:.9rem}
  .passos-gov strong{color:var(--azul)}

  .doc-assinado{display:block;font-size:.7rem;font-weight:700;color:var(--verde);margin-top:2px}
  .doc-pendente{display:block;font-size:.7rem;font-weight:700;color:#8a5a00;margin-top:2px}
  .doc-item{display:flex;justify-content:space-between;align-items:center;gap:.7rem;padding:.75rem 0;border-bottom:1px solid var(--linha);font-size:.92rem}

  .grupo-ano{margin-bottom:.2rem}
  .grupo-ano-cabecalho{display:flex;justify-content:space-between;align-items:center;padding:.65rem 0;cursor:pointer;border-bottom:1px solid var(--linha);font-size:.86rem;font-weight:700;color:var(--azul)}
  .grupo-ano-cabecalho .num{display:flex;align-items:center;gap:4px;color:var(--texto-2);font-size:.75rem;font-weight:600}
  .grupo-ano-cabecalho .num svg{width:15px;height:15px;transition:transform .15s}
  .grupo-ano-cabecalho.aberto .num svg{transform:rotate(90deg)}
  .grupo-ano-corpo{display:none;padding-left:.1rem}
  .grupo-ano-corpo.aberto{display:block}
  .doc-item:last-child{border-bottom:none}
  .doc-item .ref{font-weight:600}

  .vazio{color:var(--texto-3);font-size:.86rem;padding:1.4rem 0;text-align:center}
  .rodape{text-align:center;font-size:.72rem;color:var(--texto-3);margin-top:1.6rem}

  /* Topo do app (logado) */
  .app-top{background:var(--superficie);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;position:sticky;top:0;z-index:80;border-bottom:1px solid var(--linha);padding-top:max(.75rem, env(safe-area-inset-top));padding-left:max(1rem, env(safe-area-inset-left));padding-right:max(1rem, env(safe-area-inset-right))}
  .app-top .logo-mini{color:var(--azul);font-weight:800;font-size:.92rem}
  .app-top-acoes{display:flex;align-items:center;gap:.3rem}
  .icon-btn{background:transparent;border:none;color:var(--azul);padding:7px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:var(--superficie-2)}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.escuro{color:var(--azul)}
  .busca-caixa{position:relative}
  .busca-input{display:none;position:absolute;right:0;top:40px;width:min(84vw,320px);background:var(--superficie);border:1px solid var(--borda-forte);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:0;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .busca-input.aberta{display:block}
  .busca-resultados{position:absolute;right:0;top:88px;width:min(84vw,320px);background:var(--superficie);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:90;max-height:320px;overflow:auto}
  .busca-item{padding:.6rem .8rem;border-bottom:1px solid var(--borda);font-size:.82rem;cursor:pointer}
  .busca-item:last-child{border-bottom:none}
  .busca-item:hover{background:var(--ouro-claro)}
  .busca-item .tipo{font-size:.63rem;text-transform:uppercase;color:var(--texto-2);font-weight:800;letter-spacing:.04em}

  /* Navegação inferior */
  /* Balão do chat: acima do menu, fora do caminho do polegar e sem tapar conteúdo.
     Fica abaixo dos overlays, então some sozinho quando abre documento, vídeo ou modal. */
  .chat-flutuante{position:fixed;right:14px;bottom:calc(64px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:none;background:var(--azul);color:var(--superficie);box-shadow:0 3px 12px rgba(19,33,94,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:65}
  .chat-flutuante svg{width:22px;height:22px}
  .chat-flutuante-selo{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--vermelho);color:var(--superficie);font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--fundo)}

  .navbar-inferior{position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--borda);display:flex;z-index:70;padding-bottom:max(4px, env(safe-area-inset-bottom))}
  .nav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 6px;color:var(--texto-3);font-size:.58rem;font-weight:700;cursor:pointer;border:none;background:transparent;font-family:inherit;line-height:1.15}
  /* Em tela estreita o texto encolhe em vez de sumir cortado pela borda */
  .nav-item span{display:block;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:360px){ .nav-item{font-size:.52rem} }
  .nav-item svg{width:20px;height:20px}
  .nav-item.ativa{color:var(--azul)}

  /* Views */
  .view{display:none}
  .view.ativa{display:block}

  .dash-banner{background:var(--superficie);color:var(--azul);border-radius:14px;padding:.9rem 1.05rem;margin-bottom:.8rem;border-left:3px solid var(--ouro);box-shadow:0 1px 3px rgba(19,33,94,.05)}

  .campanha-banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:1.1rem;cursor:pointer;box-shadow:0 1px 3px rgba(19,33,94,.08);min-height:130px;background:var(--azul)}
  .campanha-banner img{width:100%;height:150px;object-fit:cover;display:block}
  .campanha-rotulo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(19,33,94,.92),rgba(19,33,94,.15) 80%,transparent);color:#ffffff;padding:2.2rem .9rem .8rem}
  .campanha-tag{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ouro);margin-bottom:.2rem}
  .campanha-rotulo h3{color:#ffffff;font-size:1rem}
  .dash-banner h3{color:var(--azul);font-size:.92rem;margin-bottom:.2rem}
  .dash-banner p{margin:0;font-size:.82rem;line-height:1.5;color:var(--texto-2)}

  .dash-saudacao{margin-bottom:1.1rem}
  .dash-saudacao h1{font-size:1.3rem}
  .dash-saudacao p{color:var(--texto-2);margin:2px 0 0;font-size:.85rem}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  /* Lista: tudo visível de uma vez, sem rolar */
  .dash-lista{display:flex;flex-direction:column;gap:.5rem}
  .dash-linha{width:100%;display:flex;align-items:center;gap:.8rem;background:var(--superficie);border:none;border-radius:14px;padding:.85rem .9rem;box-shadow:0 1px 3px rgba(19,33,94,.06);cursor:pointer;font-family:inherit;text-align:left;transition:transform .12s}
  .dash-linha:active{transform:scale(.99)}
  .dash-linha .ic{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--superficie-2);color:var(--azul)}
  .dash-linha .ic svg{width:18px;height:18px}
  .dash-linha .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .dash-linha .tit{font-size:.92rem;font-weight:800;color:var(--azul)}
  .dash-linha .contagem{font-size:.75rem;color:var(--texto-2)}
  .dash-linha .seta{color:var(--texto-3);display:flex;flex-shrink:0}
  .dash-linha .seta svg{width:17px;height:17px}
  .dash-linha.c-ouro .ic{background:#FBF3E8;color:#8a5a00}
  .dash-linha.c-verde .ic{background:#E6F5EF;color:#12775A}
  .dash-linha.c-vermelho .ic{background:#FBEAE7;color:var(--vermelho)}
  .dash-card{background:var(--superficie);border-radius:16px;padding:1.2rem 1rem;box-shadow:0 1px 3px rgba(19,33,94,.06);cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:.6rem}
  .dash-card:hover{box-shadow:0 4px 14px rgba(19,33,94,.1)}
  .dash-card:active{transform:scale(.97)}
  .dash-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--superficie-2);color:var(--azul)}
  .dash-card .ic svg{width:19px;height:19px}
  .dash-card h4{font-size:.86rem}
  .dash-card .contagem{font-size:.72rem;color:var(--texto-2)}
  .dash-card.c-neutro .ic{background:var(--superficie-2);color:var(--azul)}

  .sub-topo{margin-bottom:1rem}
  .sub-topo h2{font-size:1.15rem}

  .filtro-busca{width:100%;padding:9px 12px;border:1px solid var(--borda-forte);border-radius:9px;font-size:.85rem;margin-bottom:1rem;font-family:inherit}

  .card-item{background:var(--superficie);border-radius:16px;overflow:hidden;margin-bottom:1rem;box-shadow:0 1px 3px rgba(19,33,94,.06)}
  .card-item img{width:100%;height:130px;object-fit:cover;display:block;background:var(--ouro-claro)}
  .card-item .corpo{padding:1rem}
  .card-item h4{font-size:.96rem;margin-bottom:.3rem}
  .card-item .categoria{font-size:.66rem;font-weight:800;color:var(--ouro);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
  .card-item p{font-size:.83rem;color:var(--texto-2);margin:0 0 .8rem;line-height:1.45}
  .card-item .acoes{display:flex;flex-wrap:wrap;gap:.5rem}

  .concluido-tag{display:inline-flex;align-items:center;gap:5px;color:var(--verde);font-weight:700;font-size:.78rem}
  .concluido-tag svg{width:15px;height:15px}

  .feed-item{background:var(--superficie);border-radius:16px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(19,33,94,.06)}
  .feed-item.fixado{background:var(--superficie);border-left:3px solid var(--ouro)}
  .feed-item img{width:100%;height:auto;border-radius:9px;margin:.5rem 0;display:block}

  /* Carrossel de imagens do comunicado */
  .carrossel{display:flex;gap:.4rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:.5rem 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .carrossel::-webkit-scrollbar{display:none}
  .carrossel img{flex:0 0 100%;scroll-snap-align:center;margin:0}
  .carrossel-dica{font-size:.7rem;color:var(--texto-2);text-align:center;margin-bottom:.4rem}

  /* Texto longo com "ver mais" */
  .feed-texto{white-space:pre-wrap;font-size:.88rem;line-height:1.65;color:var(--texto-2)}
  .feed-texto a{color:var(--azul);font-weight:600;word-break:break-all}
  .feed-texto.cortado{max-height:8.5em;overflow:hidden;position:relative}
  .feed-texto.cortado::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.6em;background:linear-gradient(rgba(255,255,255,0),var(--superficie))}
  .btn-vermais{background:transparent;border:none;color:var(--azul);font-weight:800;font-size:.8rem;font-family:inherit;padding:.4rem 0;cursor:pointer}
  .feed-item .meta{font-size:.72rem;color:var(--texto-2);display:flex;justify-content:space-between;margin-bottom:.4rem}
  .feed-item .fix-badge{display:inline-flex;align-items:center;gap:4px;color:#8a5a00;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
  .feed-item .fix-badge svg{width:13px;height:13px}
  .feed-item h4{font-size:.95rem;margin-bottom:.4rem}
  .feed-item p{font-size:.87rem;line-height:1.55;margin:0;white-space:pre-wrap}

  .perfil-cabecalho{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.1rem}
  .perfil-foto{width:88px;height:88px;border-radius:50%;background:var(--azul);color:var(--superficie);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;overflow:hidden}
  .perfil-foto img{width:100%;height:100%;object-fit:cover}

  function normalizar(nome){
    return String(nome||'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');
  }
  function formatarDataBR(iso){
    if(!iso) return '—';
    const p = String(iso).slice(0,10).split('-');
    return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso;
  }
  function base64ParaBlob(base64, tipoMime){
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for(let i=0;i<binario.length;i++) bytes[i]=binario.charCodeAt(i);
    return new Blob([bytes], { type: tipoMime||'application/pdf' });
  }
  function valorAttr(v){ return String(v||'').replace(/"/g,'&quot;'); }
  function formatarDataHoraBR(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  function escaparAspas(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
  // Para textos que vão dentro de HTML gerado (folha de impressão), evitando que um "<" quebre a página.
  function escaparHtml(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function resumir(txt,n){ txt = String(txt||''); return txt.length>n ? txt.slice(0,n)+'…' : txt; }
  function statBox(num,lbl){ return '<div class="perfil-stat"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
  function saudacaoHora(){
    const h = new Date().getHours();
    if(h<12) return 'Bom dia';
    if(h<18) return 'Boa tarde';
    return 'Boa noite';
  }
  function calcularTempoEmpresa(iso){
    if(!iso) return '';
    const inicio = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(inicio.getTime())) return '';
    const agora = new Date();
    let anos = agora.getFullYear()-inicio.getFullYear();
    let meses = agora.getMonth()-inicio.getMonth();
    if(agora.getDate()<inicio.getDate()) meses--;
    if(meses<0){ anos--; meses+=12; }
    if(anos<0) return '';
    const partes=[];
    if(anos>0) partes.push(anos+(anos===1?' ano':' anos'));
    if(meses>0||partes.length===0) partes.push(meses+(meses===1?' mês':' meses'));
    return partes.join(' e ');
  }
  function calcularAnosCompletosEmpresa(iso){
    if(!iso) return 0;
    const inicio = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(inicio.getTime())) return 0;
    const agora = new Date();
    let anos = agora.getFullYear()-inicio.getFullYear();
    return anos;
  }
  function mesBate(iso){
    if(!iso) return false;
    const d = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(d.getTime())) return false;
    return d.getMonth() === new Date().getMonth();
  }
  function arquivoParaBase64(file){
    return new Promise(function(resolve,reject){
      const reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ===== Visualizador de documentos (PDF em base64) =====
  // Usado tanto pelo colaborador quanto pelo painel administrativo.
  async function abrirVisualizadorPdf(base64, titulo){
    document.getElementById('visualizador-titulo').textContent = titulo || 'Documento';
    const cont = document.getElementById('visualizador-paginas');
    document.getElementById('visualizador-overlay').classList.add('aberto');
    // Sem arquivo ainda: mostra o aviso enquanto o PDF é buscado.
    if(!base64){ cont.innerHTML = '<div id="visualizador-carregando">Carregando documento...</div>'; return; }
    cont.innerHTML = '<div id="visualizador-carregando">Carregando...</div>';
    try{
      const bytes = base64ParaBlob(base64);
      const buffer = await bytes.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      cont.innerHTML = '';
      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        cont.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
      }
    }catch(e){
      cont.innerHTML = '<div id="visualizador-carregando">Não foi possível abrir esse documento. Tente baixar em vez de ver.</div>';
    }
  }
  // O PDF fica guardado separado da ficha do documento, e só desce quando a pessoa pede.
  // Assim a abertura do portal carrega só mês e categoria, sem baixar megabytes à toa.
  // Documentos enviados antes dessa mudança guardam o arquivo na própria ficha (d.base64).
  const arquivosEmCache = {};
  async function buscarArquivoDocumento(d){
    if(!d) return '';
    if(d.base64) return d.base64;
    if(arquivosEmCache[d._id]) return arquivosEmCache[d._id];
    const snap = await getDoc(doc(dbF,'portal_arquivos', d._id));
    if(snap.exists()){
      const base64 = snap.data().base64 || '';
      arquivosEmCache[d._id] = base64;
      return base64;
    }
    // Depois de assinado no gov.br, o Administrativo pode descartar o original para
    // economizar espaço. Nesse caso o documento que vale é o assinado.
    const assinado = await getDoc(doc(dbF,'portal_arquivos_assinados', d._id));
    if(assinado.exists()){
      const base64 = assinado.data().base64 || '';
      arquivosEmCache[d._id] = base64;
      return base64;
    }
    return '';
  }

    const blob = base64ParaBlob(base64);
    const a = document.createElement('a');
    const objUrl = URL.createObjectURL(blob);
    a.href = objUrl;
    a.download = (d.nomeArquivo||'documento').replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(objUrl); }, 10000);
  };

  // Reconhece links de YouTube/Vimeo (e arquivos de vídeo diretos) e monta um player
  // embutido de verdade. Qualquer outro link (ex: OneDrive, Google Drive) não dá pra
  // garantir que embuta — nesses casos abre em uma aba nova.
  function obterEmbedVideo(url){
    if(!url) return null;
    const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([\w-]{6,})/);
    if(yt) return { tipo:'iframe', src:'https://www.youtube.com/embed/'+yt[1] };
    const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(vimeo) return { tipo:'iframe', src:'https://player.vimeo.com/video/'+vimeo[1] };
    const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if(drive) return { tipo:'iframe', src:'https://drive.google.com/file/d/'+drive[1]+'/preview' };
    if(/onedrive\.live\.com\/embed/i.test(url) || /\.sharepoint\.com\/.*\/embed/i.test(url)) return { tipo:'iframe', src:url };
    if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(url)) return { tipo:'direto', src:url };
    return null;
  }
  window.abrirVideo = function(url){
    const embed = obterEmbedVideo(url);
    if(!embed){ window.open(url, '_blank', 'noopener'); return; }
    let corpo;
    if(embed.tipo==='direto'){
      // Sem autoplay: os navegadores bloqueiam início automático com som e o vídeo ficaria
      // parado no primeiro quadro, que costuma ser preto. playsinline evita o iPhone jogar
      // para tela cheia sozinho. Se o formato não for suportado, mostramos uma saída.
      corpo = '<video class="video-portal" controls playsinline preload="metadata" src="'+embed.src+'" '+
        'onerror="document.getElementById(\'video-alternativa\').style.display=\'block\'"></video>'+
        '<div id="video-alternativa" style="display:none;margin-top:.8rem;font-size:.85rem;color:var(--texto-2);line-height:1.6">'+
          'Seu aparelho não conseguiu tocar esse vídeo. '+
          '<a href="'+embed.src+'" target="_blank" rel="noopener" style="color:var(--azul);font-weight:700">Abrir em outra aba</a>'+
        '</div>';
    } else {
      corpo = '<div class="video-iframe-caixa">'+
        '<iframe src="'+embed.src+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>'+
      '</div>';
    }
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>Vídeo</h3><button class="icon-btn escuro" onclick="fecharModal()">'+icone('fechar')+'</button></div>'+corpo;
    document.getElementById('modal-overlay').classList.add('aberto');
  };

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').then(function(reg){
        // Procura versão nova ao abrir e a cada meia hora com o app aberto.
        reg.update();
        setInterval(function(){ reg.update(); }, 30*60*1000);
      }).catch(function(e){
        console.warn('Não foi possível registrar o service worker:', e);
      });
      // Quando a versão nova assume, recarrega uma única vez para a pessoa já usar o portal
      // atualizado — sem precisar desinstalar e instalar de novo.
      // Só recarrega se JÁ existia uma versão controlando a página. Na primeira abertura o
      // service worker também assume o controle, e recarregar ali interrompia o carregamento:
      // era isso que fazia o app abrir em branco e só funcionar na segunda tentativa.
      const tinhaVersaoAnterior = !!navigator.serviceWorker.controller;
      let jaRecarregou = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!tinhaVersaoAnterior || jaRecarregou) return;
        jaRecarregou = true;
        location.reload();
      });
    });

  async function carregarDocumentos(){
    const q = query(collection(dbF,'portal_documentos'), where('funcionarioId','==', funcionarioIdAtual));
    const snap = await getDocs(q);
    const arr = [];
    const agora = new Date().toISOString();
    snap.forEach(function(d){
      const dados = d.data();
      // Documento agendado ainda não aparece para o colaborador.
      if(dados.liberarEm && dados.liberarEm > agora) return;
      arr.push(Object.assign({_id:d.id}, dados));
    });
    listaDocumentos = arr;
    window._meusDocumentos = listaDocumentos;
  }

  async function carregarFuncionariosAdmin(forcar){
    if(listaFuncionariosAdmin.length && !forcar) return;
    const snap = await getDocs(collection(dbF,'portal_funcionarios'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    // Cada reset de acesso no RH cria um login novo sem apagar o antigo, então o mesmo
    // funcionário pode aparecer mais de uma vez aqui. Como documentos são ligados por
    // funcionarioId (não pelo login em si), mantemos só um registro por funcionarioId.
    const vistos = {};
    const semDuplicados = [];
    arr.forEach(function(f){
      const chave = f.funcionarioId || f._id;
      if(vistos[chave]) return;
      vistos[chave] = true;
      semDuplicados.push(f);
    });
    semDuplicados.sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
    listaFuncionariosAdmin = semDuplicados;
  }
  async function carregarTudo(){
    // Promise.allSettled (não Promise.all): se alguma coleção falhar (ex: permissão do
    // Firestore ainda não liberada para algo novo), as outras continuam funcionando —
    // em vez de travar a tela inteira em branco por causa de uma coleção só.
    const resultados = await Promise.allSettled([
      carregarDocumentos(), carregarBeneficios(),
      carregarTreinamentos(), carregarComunicados(), carregarConclusoes(), carregarCampanha(), carregarMinhaDuvida(), carregarFaq(), carregarAssinaturas()
    ]);
    const nomes = ['documentos','benefícios','treinamentos','comunicados','conclusões de treinamento','campanha do mês','dúvidas','perguntas frequentes','assinaturas'];
    const falhas = [];
    resultados.forEach(function(r, i){
      if(r.status==='rejected'){
        console.error('Falha ao carregar '+nomes[i]+':', r.reason);
        falhas.push(nomes[i]);
      }
    });
    return falhas;
  }

  // ===== Assinatura de documentos =====
  // Assinatura eletrônica simples: registra quem assinou, quando, de qual aparelho e a
  // impressão digital do arquivo naquele momento. Se o PDF for alterado depois, a impressão
  // deixa de bater — é isso que comprova que foi aquele arquivo exato que a pessoa assinou.
  // Assinatura desligada por decisão da empresa, até o jurídico se posicionar.
  // Todo o mecanismo continua no código: para reativar, basta listar aqui os tipos que
  // podem ser assinados — por exemplo ['holerite_mensal'] — e voltar as duas caixas
  // marcadas com "assinatura desligada" no formulário de envio e no lote.
  const TIPOS_ASSINAVEIS = [];
  function podeAssinar(tipo){ return TIPOS_ASSINAVEIS.indexOf(tipo) >= 0; }
  let minhasAssinaturas = {};
  const documentosAbertos = {};

  async function carregarAssinaturas(){
    minhasAssinaturas = {};
    if(!TIPOS_ASSINAVEIS.length) return;   // desligado: nem consulta o banco
    if(!funcionarioIdAtual) return;
    const q = query(collection(dbF,'portal_assinaturas'), where('funcionarioId','==', funcionarioIdAtual));
    const snap = await getDocs(q);
    snap.forEach(function(d){ minhasAssinaturas[d.id] = d.data(); });
  }
  async function impressaoDigital(base64){
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const buffer = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buffer)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }
  function comoFoiAssinado(a){
    if(!a) return '';
    if(a.metodo==='fisico') return 'Assinado fisicamente';
    if(a.metodo==='gov') return 'Assinado virtualmente pelo gov.br';
    return 'Assinado virtualmente';
  }
  function assinaturaNaLista(d){
    const a = minhasAssinaturas[d._id];
    if(a) return '<small class="doc-assinado">'+comoFoiAssinado(a)+(a.metodo==='fisico'?'':(' em '+formatarDataHoraBR(a.assinadoEm)))+'</small>';
    if(d.pedeAssinatura && podeAssinar(d.tipo)) return '<small class="doc-pendente">Assinatura pendente</small>';
    return '';
  }
  function botaoAssinar(d){
    if(!d.pedeAssinatura || !podeAssinar(d.tipo) || minhasAssinaturas[d._id]) return '';
    if(!documentosAbertos[d._id]){
      return '<button class="btn btn-outline btn-sm" disabled title="Abra o documento primeiro">Assinar</button>';
    }
    return '<button class="btn btn-azul btn-sm" onclick="abrirAssinatura('+d._idx+')">Assinar</button>';
  }

  window.assinarComGov = function(idx){

    document.getElementById('modal-box').innerHTML =

  // Confere se o PDF enviado é mesmo o documento que a pessoa baixou. Não dá para comparar
  // os arquivos byte a byte: o gov.br altera o PDF ao assinar. O que se compara é o conteúdo —
  // o texto do original tem que aparecer dentro do arquivo assinado.
  async function textoDoPdf(base64){
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    let texto = '';
    for(let p=1; p<=pdf.numPages; p++){
      const conteudo = await (await pdf.getPage(p)).getTextContent();
      texto += ' ' + conteudo.items.map(function(i){ return i.str; }).join(' ');
    }
    // normalizar() tira os espaços, o que inutilizaria a comparação por palavras.
    // Aqui os espaços são preservados de propósito.
    return String(texto)
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }
  async function conferirMesmoDocumento(base64Original, base64Assinado){
    let textoOriginal, textoAssinado;
    try{
      textoOriginal = await textoDoPdf(base64Original);
      textoAssinado = await textoDoPdf(base64Assinado);
    }catch(e){
      console.warn('Não foi possível ler o texto dos PDFs', e);
      return { confere:true, motivo:'sem-texto' };   // na dúvida, não bloqueia
    }
    // Documento digitalizado não tem texto: aí não há o que comparar.
    if(textoOriginal.replace(/\s/g,'').length < 80) return { confere:true, motivo:'sem-texto' };
    const palavras = textoOriginal.split(/\s+/).filter(function(p){ return p.length > 3; });
    if(palavras.length < 15) return { confere:true, motivo:'sem-texto' };
    let achadas = 0;
    palavras.forEach(function(p){ if(textoAssinado.indexOf(p) >= 0) achadas++; });
    const proporcao = achadas / palavras.length;
    return { confere: proporcao >= 0.85, proporcao: proporcao };
  }

  // Meses completos de casa, para as regras de liberação por tempo.
  function mesesDeEmpresa(){
    if(!perfilAtual.dataAdmissao) return null;   // sem data não dá para conferir
    const adm = new Date(perfilAtual.dataAdmissao+'T00:00:00');
    if(isNaN(adm.getTime())) return null;
    const hoje = new Date();
    let meses = (hoje.getFullYear()-adm.getFullYear())*12 + (hoje.getMonth()-adm.getMonth());
    if(hoje.getDate() < adm.getDate()) meses--;
    return Math.max(0, meses);
  }
  function beneficioLiberadoParaMim(b){
    if(b.ativo===false) return false;
    // Tempo mínimo de casa. Sem data de admissão na ficha, o benefício restrito não aparece,
    // para ninguém ser informado de algo a que ainda não tem direito.
    const minimo = Number(b.mesesMinimos||0);
    if(minimo > 0){
      const meses = mesesDeEmpresa();
      if(meses === null || meses < minimo) return false;
    }
    // Setores e cargos: em branco vale para todo mundo.
    if(b.setores && b.setores.length){
      const meu = normalizar(perfilAtual.setor);
      if(!b.setores.some(function(x){ return normalizar(x)===meu; })) return false;
    }
    if(b.cargos && b.cargos.length){
      const meu = normalizar(perfilAtual.cargo);
      if(!b.cargos.some(function(x){ return normalizar(x)===meu; })) return false;
    }
    return true;
  }

  // ===== Notificações no celular =====
  function suportaNotificacoes(){
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  }
  function chavePushEmBytes(){
    const normal = PUSH_CHAVE_PUBLICA.replace(/-/g,'+').replace(/_/g,'/');
    const completo = normal + '==='.slice((normal.length + 3) % 4);
    const bin = atob(completo);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function inscricaoAtual(){
    if(!suportaNotificacoes()) return null;
    try{
      const reg = await navigator.serviceWorker.ready;
      return await reg.pushManager.getSubscription();
    }catch(e){ return null; }
  }
  async function desenharCartaoNotificacoes(){
    const cont = document.getElementById('card-notificacoes');
    if(!cont) return;
    const titulo = '<label>Notificações no celular</label>';
    if(!suportaNotificacoes()){
      cont.innerHTML = titulo + '<p style="font-size:.83rem;color:var(--texto-2);line-height:1.6;margin:0">Este navegador não recebe notificações. No iPhone, instale o portal na tela de início pelo Safari e abra por lá.</p>';
      return;
    }
    if(Notification.permission === 'denied'){
      cont.innerHTML = titulo + '<p style="font-size:.83rem;color:var(--texto-2);line-height:1.6;margin:0">As notificações estão bloqueadas para este site. Libere nas configurações do navegador e volte aqui.</p>';
      return;
    }
    const inscricao = await inscricaoAtual();
    if(inscricao){
      cont.innerHTML = titulo +
        '<p style="font-size:.83rem;color:var(--verde);line-height:1.6;margin:0 0 .7rem">Ativadas. Você será avisado quando houver documento, comunicado ou curso novo.</p>'+
        '<button class="btn btn-outline btn-full" onclick="desativarNotificacoes()">Desativar</button>';
      return;
    }
    cont.innerHTML = titulo +
      '<p style="font-size:.83rem;color:var(--texto-2);line-height:1.6;margin:0 0 .7rem">Receba um aviso no celular quando o RH publicar algo novo.</p>'+
      '<button class="btn btn-azul btn-full" onclick="ativarNotificacoes()">Ativar notificações</button>'+
      '<div class="erro" id="notif-erro" style="margin:.6rem 0 0"></div>';
  }
  // Cada aparelho tem seu próprio registro. O id junta o login com um código do endereço de
  // entrega, então dois celulares da mesma pessoa convivem, e reativar no mesmo celular
  // atualiza o registro dele em vez de criar outro.
  function codigoDoAparelho(endpoint){
    let soma = 0;
    const txt = String(endpoint||'');
    for(let i=0;i<txt.length;i++){ soma = (soma*31 + txt.charCodeAt(i)) >>> 0; }
    return soma.toString(36);
  }
  function idDaInscricao(endpoint){
    return auth.currentUser.uid + '-' + codigoDoAparelho(endpoint);
  }
  window.ativarNotificacoes = async function(){
    const erroEl = document.getElementById('notif-erro');
    if(erroEl){ erroEl.style.color='var(--vermelho)'; erroEl.textContent=''; }
    try{
      const permissao = await Notification.requestPermission();
      if(permissao !== 'granted'){
        if(erroEl) erroEl.textContent = 'Você precisa tocar em "Permitir" para receber os avisos.';
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const inscricao = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: chavePushEmBytes()
      });
      // Guardado por aparelho, para o painel saber todos os destinos de cada pessoa.
      await setDoc(doc(dbF,'portal_push', idDaInscricao(inscricao.endpoint)), {
        uid: auth.currentUser.uid,
        endpoint: inscricao.endpoint,
        funcionarioId: funcionarioIdAtual,
        nome: perfilAtual.nome || '',
        aparelho: descreverAparelho().sistema + ' · ' + descreverAparelho().navegador,
        criadoEm: new Date().toISOString()
      });
      desenharCartaoNotificacoes();
    }catch(e){
      console.error(e);
      if(erroEl) erroEl.textContent = 'Não foi possível ativar agora. Tente de novo mais tarde.';
    }
  };
  window.desativarNotificacoes = async function(){
    try{
      const inscricao = await inscricaoAtual();
      // Desativa só este aparelho; os outros da mesma pessoa continuam recebendo.
      if(inscricao){
        await deleteDoc(doc(dbF,'portal_push', idDaInscricao(inscricao.endpoint)));
        await inscricao.unsubscribe();
      }
    }catch(e){ console.warn('Falha ao desativar notificações', e); }
    desenharCartaoNotificacoes();
  };

  // Lado do RH: escolhe o que foi atualizado, grava o recado e avisa os aparelhos inscritos.
  const AREAS_AVISO = [
    ['documento',   'Documentos',   'um novo documento foi enviado'],
    ['comunicado',  'Comunicados',  'um novo comunicado foi publicado'],
    ['curso',       'Cursos',       'um novo curso foi liberado'],
    ['treinamento', 'Treinamentos', 'um novo treinamento foi liberado']
  ];
  // Cada tipo tem a sua frase, para a concordância sair certa.
  const FRASES_DOCUMENTO = {
    holerite_mensal: 'um novo holerite foi enviado',
    holerite_ferias: 'um novo recibo de férias foi enviado',
    aviso_ferias:    'um novo aviso de férias foi enviado',
    notificacao:     'uma nova notificação foi enviada',
    folha_ponto:     'uma nova folha de ponto foi enviada'
  };
  function montarMensagemAviso(chaves){
    const trechos = AREAS_AVISO.filter(function(a){ return chaves.indexOf(a[0]) >= 0; }).map(function(a){
      // Para documentos, dá para dizer qual: "um novo holerite mensal foi enviado".
      if(a[0]==='documento'){
        const seletor = document.getElementById('aviso-tipo-documento');
        const tipo = seletor ? seletor.value : '';
        if(tipo && FRASES_DOCUMENTO[tipo]) return FRASES_DOCUMENTO[tipo];
      }
      return a[2];
    });
    if(!trechos.length) return null;
    let frase;
    if(trechos.length === 1) frase = trechos[0];
    else frase = trechos.slice(0,-1).join(', ') + ' e ' + trechos[trechos.length-1];
    // A frase começa a notificação, então entra com maiúscula.
    frase = frase.charAt(0).toUpperCase() + frase.slice(1);
    return {
      titulo: trechos.length === 1 ? 'Há novidade para você!' : 'Há novidades para você!',
      mensagem: frase + '. Toque para abrir.'
    };
  }
  window.avisarColaboradores = async function(){
    const status = document.getElementById('aviso-status');
    status.style.color = 'var(--texto-2)';
    status.textContent = '';
    const marcadas = AREAS_AVISO.filter(function(a){
      const el = document.getElementById('aviso-'+a[0]);
      return el && el.checked;
    }).map(function(a){ return a[0]; });
    const recado = montarMensagemAviso(marcadas);
    if(!recado){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Marque pelo menos uma área atualizada.';
      return;
    }
    if(PUSH_ENDERECO.indexOf('COLE_AQUI') === 0){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'O endereço do disparador ainda não foi configurado no portal.';
      return;
    }
    status.textContent = 'Buscando aparelhos inscritos...';
    let inscricoes = [];
    let porEndpoint = {};
    try{
      const snap = await getDocs(collection(dbF,'portal_push'));
      snap.forEach(function(d){
        const dados = d.data();
        if(dados.endpoint){ inscricoes.push(dados.endpoint); porEndpoint[dados.endpoint] = d.id; }
      });
    }catch(e){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Não foi possível ler a lista de aparelhos.';
      return;
    }
    if(!inscricoes.length){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Ninguém ativou as notificações ainda.';
      return;
    }
    if(!confirm('Avisar '+inscricoes.length+' aparelho(s)?\n\n"'+recado.titulo+'\n'+recado.mensagem+'"')) { status.textContent=''; return; }
    status.textContent = 'Enviando...';
    try{
      // O recado precisa estar gravado antes do disparo: é dele que o celular lê o texto.
      await setDoc(doc(dbF,'portal_avisos','atual'), {
        titulo: recado.titulo, mensagem: recado.mensagem, enviadoEm: new Date().toISOString()
      });
      const resposta = await fetch(PUSH_ENDERECO, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: PUSH_SENHA, inscricoes: inscricoes })
      });
      const resultado = await resposta.json();
      if(!resposta.ok) throw new Error(resultado.erro || 'falha');
      // Aparelhos que saíram do ar (app desinstalado, navegador limpo) são removidos da lista.
      for(const endpoint of (resultado.expirados||[])){
        try{ await deleteDoc(doc(dbF,'portal_push', porEndpoint[endpoint])); }catch(e){}
      }
      status.style.color = 'var(--verde)';
      status.textContent = 'Aviso enviado para '+resultado.enviados+' aparelho(s).'+
        ((resultado.expirados&&resultado.expirados.length)?(' '+resultado.expirados.length+' inscrição(ões) expirada(s) foram removidas.'):'')+
        ((resultado.falhas&&resultado.falhas.length)?(' '+resultado.falhas.length+' falharam.'):'');
    }catch(e){
      console.error(e);
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Não foi possível enviar agora.';
    }
  };

  // ===== Dúvidas sobre documentos =====
  // Uma conversa por colaborador, guardada num documento só (id = funcionarioId).
  // O colaborador abre pela aba Documentos; o RH responde pela aba Dúvidas.
  function agoraISO(){ return new Date().toISOString(); }

  async function carregarMinhaDuvida(){
    if(!funcionarioIdAtual) { minhaDuvida = null; return; }
    try{
      const snap = await getDoc(doc(dbF,'portal_duvidas', funcionarioIdAtual));
      minhaDuvida = snap.exists() ? snap.data() : null;
    }catch(e){ minhaDuvida = null; }
  }
  function bolhasConversa(conversa, ladoProprio){
    const mensagens = (conversa && conversa.mensagens) || [];
    if(!mensagens.length) return '<div class="conversa" id="conversa-caixa"><div class="vazio">Nenhuma mensagem ainda.</div></div>';
    return '<div class="conversa" id="conversa-caixa">'+mensagens.map(function(m){
      const minha = m.de === ladoProprio;
      return '<div class="balao '+(minha?'meu':'outro')+'">'+
        (m.documento?('<div class="balao-ref">Sobre: '+escaparHtml(m.documento)+'</div>'):'')+
        '<div class="balao-texto">'+escaparHtml(m.texto)+'</div>'+
        '<div class="balao-hora">'+(minha?'Você':(m.de==='rh'?'Administrativo':'Colaborador'))+' · '+formatarDataHoraBR(m.em)+'</div>'+
      '</div>';
    }).join('')+'</div>';
  }
  // Mantém a conversa acompanhando o Firestore em tempo real: quem estiver com a tela aberta
  // vê a resposta chegar sem precisar recarregar o portal.
  function rolarConversaParaOFim(){
    const caixa = document.getElementById('conversa-caixa');
    if(caixa) caixa.scrollTop = caixa.scrollHeight;
  }
  function atualizarTelaDuvidasColaborador(){
    // Troca só os balões — o que a pessoa está digitando fica intacto.
    const caixa = document.getElementById('conversa-caixa');
    if(caixa){
      caixa.outerHTML = bolhasConversa(minhaDuvida, 'colaborador');
      rolarConversaParaOFim();
    }
    const novas = (minhaDuvida && minhaDuvida.naoLidasColaborador) || 0;
    const botao = document.getElementById('btn-duvidas-colaborador');
    if(botao){
      botao.textContent = 'Falar com o Administrativo' + (novas?(' ('+novas+' resposta(s) nova(s))'):'');
    }
    const selo = document.getElementById('chat-flutuante-selo');
    if(selo){
      selo.textContent = novas > 9 ? '9+' : String(novas);
      selo.classList.toggle('hidden', !novas);
    }
  }
  function escutarMinhasDuvidas(){
    if(pararEscutaDuvidas){ pararEscutaDuvidas(); pararEscutaDuvidas = null; }
    if(!funcionarioIdAtual) return;
    pararEscutaDuvidas = onSnapshot(doc(dbF,'portal_duvidas', funcionarioIdAtual), function(snap){
      minhaDuvida = snap.exists() ? snap.data() : null;
      atualizarTelaDuvidasColaborador();
    }, function(e){ console.warn('Escuta de dúvidas interrompida', e); });
  }

  window.abrirMinhasDuvidas = async function(documentoRef){
    document.getElementById('modal-box').innerHTML = '<div class="vazio">Carregando...</div>';
    document.getElementById('modal-overlay').classList.add('aberto');
    await carregarMinhaDuvida();
    // Ao abrir, o que o RH respondeu deixa de ser novidade.
    if(minhaDuvida && minhaDuvida.naoLidasColaborador){
      try{ await setDoc(doc(dbF,'portal_duvidas', funcionarioIdAtual), { naoLidasColaborador: 0 }, { merge:true }); minhaDuvida.naoLidasColaborador = 0; }catch(e){}
    }
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>Dúvidas sobre documentos</h3><button class="icon-btn escuro" onclick="fecharModal(); renderDocumentosView();">'+icone('fechar')+'</button></div>'+
      (documentoRef?('<p class="dica-campo" style="margin-top:0">Sobre: '+escaparHtml(documentoRef)+'</p>'):'')+
      bolhasConversa(minhaDuvida, 'colaborador')+
      '<label style="margin-top:1rem">Sua mensagem</label>'+
      '<textarea id="f-duvida-texto" placeholder="Escreva sua dúvida sobre o documento"></textarea>'+
      '<div class="erro" id="f-duvida-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="enviarMinhaDuvida('+(documentoRef?("'"+escaparAspas(documentoRef)+"'"):'null')+')">Enviar</button>';
    rolarConversaParaOFim();
  };
  window.enviarMinhaDuvida = async function(documentoRef){
    const texto = document.getElementById('f-duvida-texto').value.trim();
    const erroEl = document.getElementById('f-duvida-erro');
    erroEl.style.color = 'var(--vermelho)';
    if(!texto){ erroEl.textContent = 'Escreva sua dúvida antes de enviar.'; return; }
    const mensagens = ((minhaDuvida && minhaDuvida.mensagens) || []).slice();
    mensagens.push({ de:'colaborador', texto:texto, em:agoraISO(), documento: documentoRef || '' });
    try{
      await setDoc(doc(dbF,'portal_duvidas', funcionarioIdAtual), {
        funcionarioId: funcionarioIdAtual,
        nome: perfilAtual.nome || '',
        mensagens: mensagens,
        atualizadoEm: agoraISO(),
        naoLidasRh: ((minhaDuvida && minhaDuvida.naoLidasRh) || 0) + 1,
        naoLidasColaborador: 0
      }, { merge:true });
      document.getElementById('f-duvida-texto').value = '';
      erroEl.style.color = 'var(--verde)';
      erroEl.textContent = 'Mensagem enviada.';
    }catch(e){
      console.error(e);
      erroEl.textContent = 'Não foi possível enviar agora.';
    }
  };

  // Lado do RH
  function escutarDuvidasAdmin(){
    if(pararEscutaDuvidas){ pararEscutaDuvidas(); pararEscutaDuvidas = null; }
    pararEscutaDuvidas = onSnapshot(collection(dbF,'portal_duvidas'), function(snap){
      const arr = [];
      snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
      arr.sort(function(a,b){ return (b.atualizadoEm||'').localeCompare(a.atualizadoEm||''); });
      listaDuvidasAdmin = arr;
      atualizarSeloAbaDuvidas();
      // Redesenha a lista só se a aba estiver aberta, e os balões só se a conversa estiver aberta.
      if(adminTabAtual === 'duvidas') desenharListaDuvidas();
      if(duvidaAbertaId){
        const caixa = document.getElementById('conversa-caixa');
        const conversa = listaDuvidasAdmin.find(function(c){ return c._id===duvidaAbertaId; });
        if(caixa && conversa){ caixa.outerHTML = bolhasConversa(conversa, 'rh'); rolarConversaParaOFim(); }
      }
    }, function(e){ console.warn('Escuta de dúvidas interrompida', e); });
  }
  function atualizarSeloAbaDuvidas(){
    const botao = document.getElementById('admin-tab-duvidas');
    if(!botao) return;
    const pendentes = listaDuvidasAdmin.filter(function(c){ return c.naoLidasRh; }).length;
    botao.textContent = 'Dúvidas' + (pendentes?(' ('+pendentes+')'):'');
  }
  async function carregarDuvidasAdmin(){
    const snap = await getDocs(collection(dbF,'portal_duvidas'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    arr.sort(function(a,b){ return (b.atualizadoEm||'').localeCompare(a.atualizadoEm||''); });
    listaDuvidasAdmin = arr;
  }
  async function renderAdminDuvidas(){
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio">Carregando...</div>';
    try{ await carregarDuvidasAdmin(); }
    catch(e){ cont.innerHTML = '<div class="vazio">Não foi possível carregar as dúvidas agora.</div>'; return; }
    desenharListaDuvidas();
  }
  function desenharListaDuvidas(){
    const cont = document.getElementById('admin-conteudo');
    if(!cont) return;
    if(!listaDuvidasAdmin.length){ cont.innerHTML = '<div class="vazio">Nenhuma dúvida enviada até agora.</div>'; return; }
    cont.innerHTML = listaDuvidasAdmin.map(function(c){
      const ultima = (c.mensagens && c.mensagens.length) ? c.mensagens[c.mensagens.length-1] : null;
      return '<div class="admin-lista-item"><div class="info">'+
          '<h5>'+(c.nome||c._id)+(c.naoLidasRh?(' <span class="selo selo-aviso">'+c.naoLidasRh+' nova(s)</span>'):'')+'</h5>'+
          '<small>'+(ultima?(resumir(ultima.texto,60)+' · '+formatarDataHoraBR(ultima.em)):'sem mensagens')+'</small>'+
        '</div>'+
        '<div class="btns"><button class="btn btn-outline btn-sm" onclick="abrirDuvidaAdmin(\''+c._id+'\')">Abrir</button></div>'+
      '</div>';
    }).join('');
  }
  window.abrirDuvidaAdmin = async function(id){
    const conversa = listaDuvidasAdmin.find(function(c){ return c._id===id; });
    if(!conversa) return;
    if(conversa.naoLidasRh){
      try{ await setDoc(doc(dbF,'portal_duvidas', id), { naoLidasRh: 0 }, { merge:true }); conversa.naoLidasRh = 0; }catch(e){}
    }
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>'+(conversa.nome||id)+'</h3><button class="icon-btn escuro" onclick="fecharModal(); mostrarAdminTab(\'duvidas\');">'+icone('fechar')+'</button></div>'+
      bolhasConversa(conversa, 'rh')+
      '<label style="margin-top:1rem">Resposta</label>'+
      '<textarea id="f-resp-texto" placeholder="Escreva a resposta"></textarea>'+
      '<label class="checkbox-linha"><input type="checkbox" id="f-resp-notificar" checked> Notificar no celular do colaborador</label>'+
      '<div class="erro" id="f-resp-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="responderDuvida(\''+id+'\')">Responder</button>';
    document.getElementById('modal-overlay').classList.add('aberto');
    duvidaAbertaId = id;
    rolarConversaParaOFim();
  };
  window.responderDuvida = async function(id){
    const texto = document.getElementById('f-resp-texto').value.trim();
    const erroEl = document.getElementById('f-resp-erro');
    const notificar = document.getElementById('f-resp-notificar').checked;
    erroEl.style.color = 'var(--vermelho)';
    if(!texto){ erroEl.textContent = 'Escreva a resposta antes de enviar.'; return; }
    const conversa = listaDuvidasAdmin.find(function(c){ return c._id===id; }) || {};
    const mensagens = (conversa.mensagens || []).slice();
    mensagens.push({ de:'rh', texto:texto, em:agoraISO(), documento:'' });
    try{
      await setDoc(doc(dbF,'portal_duvidas', id), {
        mensagens: mensagens,
        atualizadoEm: agoraISO(),
        naoLidasRh: 0,
        naoLidasColaborador: (conversa.naoLidasColaborador || 0) + 1
      }, { merge:true });
      if(notificar) await notificarUmColaborador(id);
      duvidaAbertaId = null;
      fecharModal();
    }catch(e){
      console.error(e);
      erroEl.textContent = 'Não foi possível responder agora.';
    }
  };
  // Notifica só o aparelho de quem perguntou, e não a empresa toda.
  async function notificarUmColaborador(funcionarioId){
    try{
      const snap = await getDocs(query(collection(dbF,'portal_push'), where('funcionarioId','==', funcionarioId)));
      const enderecos = [];
      snap.forEach(function(d){ if(d.data().endpoint) enderecos.push(d.data().endpoint); });
      if(!enderecos.length) return;
      await setDoc(doc(dbF,'portal_avisos','atual'), {
        titulo: 'O Administrativo respondeu você',
        mensagem: 'Sua dúvida sobre documentos tem uma resposta. Toque para abrir.',
        enviadoEm: agoraISO()
      });
      await fetch(PUSH_ENDERECO, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ senha: PUSH_SENHA, inscricoes: enderecos })
      });
    }catch(e){ console.warn('Não foi possível notificar a resposta', e); }
  }

  // ===== Cursos e treinamentos =====
  function renderTreinamentosView(){
    const cont = document.getElementById('view-treinamentos');
    cont.innerHTML = '<div class="sub-topo"><h2>Cursos e treinamentos</h2></div>'+
      '<div class="filtros-chips" id="treino-filtros"></div>'+
      '<div id="treinamentos-lista"></div>';
    desenharFiltrosTreino();
    desenharTreinamentos();
  }
  let filtroTreino = 'todos';
  function ehDoTipo(t, filtro){
    if(filtro==='todos') return true;
    // Cadastros antigos, sem classificação gravada, contam como treinamento.
    const semClassificacao = t.ehCurso === undefined && t.ehTreinamento === undefined;
    if(filtro==='curso') return t.ehCurso === true;
    return t.ehTreinamento === true || semClassificacao;
  }
  function desenharFiltrosTreino(){
    const cont = document.getElementById('treino-filtros');
    if(!cont) return;
    const opcoes = [['todos','Todos'],['treinamento','Treinamentos'],['curso','Cursos']];
    cont.innerHTML = opcoes.map(function(o){
      return '<button class="chip'+(filtroTreino===o[0]?' ativo':'')+'" onclick="filtrarTreinos(\''+o[0]+'\')">'+o[1]+'</button>';
    }).join('');
  }
  window.filtrarTreinos = function(valor){
    filtroTreino = valor;
    desenharFiltrosTreino();
    desenharTreinamentos();
  };
  function treinamentosVisiveisParaMim(){
    const meuSetorNorm = normalizar(perfilAtual.setor);
    return listaTreinamentos.filter(function(t){
      if(t.ativo===false) return false;
      if(!t.setores || !t.setores.length) return true;
      return t.setores.some(function(s){ return normalizar(s)===meuSetorNorm; });
    });
  }
  function cartaoTreinamento(t){
    const concl = listaConclusoes.find(function(c){ return c.treinamentoId===t._id; });
    let botoes = '';
    if(t.descricao) botoes += '<button class="btn btn-outline btn-sm" onclick="abrirDetalheTexto(\''+escaparAspas(t.titulo)+'\',\''+escaparAspas(t.descricao)+'\')">Saiba mais</button>';
    if(t.curso) botoes += '<a class="btn btn-azul btn-sm" href="'+t.curso+'" target="_blank" rel="noopener">Ir ao site</a>';
    if(t.video) botoes += '<button class="btn btn-outline btn-sm" onclick="abrirVideo(\''+escaparAspas(t.video)+'\')">Assistir vídeo</button>';
    if(t.pdf) botoes += '<a class="btn btn-outline btn-sm" href="'+t.pdf+'" target="_blank" rel="noopener">Abrir PDF</a>';
    const acaoConclusao = concl ?
      '<span class="concluido-tag">'+icone('check')+' Concluído em '+formatarDataBR(concl.dataConclusao)+'</span>' :
      '<button class="btn btn-azul btn-sm" onclick="concluirTreinamento(\''+t._id+'\')">Marcar como concluído</button>';
    const etiquetas = [];
    if(t.ehCurso) etiquetas.push('Curso');
    if(t.ehTreinamento || (t.ehCurso===undefined && t.ehTreinamento===undefined)) etiquetas.push('Treinamento');
    return '<div class="card-item">'+
      (t.imagem?('<img src="'+t.imagem+'" alt="">'):'')+
      '<div class="corpo">'+
        (etiquetas.length?('<div class="categoria">'+etiquetas.join(' · ')+'</div>'):'')+
        '<h4>'+(t.titulo||'')+'</h4>'+
        (t.descricao?('<p>'+resumir(t.descricao,140)+'</p>'):'')+
        '<div class="acoes">'+botoes+'</div>'+
        '<div style="margin-top:.7rem">'+acaoConclusao+'</div>'+
      '</div></div>';
  }
  function desenharTreinamentos(){
    const cont = document.getElementById('treinamentos-lista');
    const ativos = treinamentosVisiveisParaMim().filter(function(t){ return ehDoTipo(t, filtroTreino); });
    if(!ativos.length){ cont.innerHTML = '<div class="vazio">Nada disponível por aqui ainda.</div>'; return; }
    // Agrupado pela categoria (Fundação Bradesco, SESI...) para não virar uma lista solta.
    const grupos = {};
    ativos.forEach(function(t){
      const chave = (t.categoria||'').trim() || 'Outros';
      grupos[chave] = grupos[chave] || [];
      grupos[chave].push(t);
    });
    const nomes = Object.keys(grupos).sort(function(a,b){
      if(a==='Outros') return 1;
      if(b==='Outros') return -1;
      return a.localeCompare(b,'pt-BR');
    });
    if(nomes.length === 1){ cont.innerHTML = grupos[nomes[0]].map(cartaoTreinamento).join(''); return; }
    cont.innerHTML = nomes.map(function(nome){
      return blocoColapsavel(nome, grupos[nome].length, true, grupos[nome].map(cartaoTreinamento).join(''));
    }).join('');
  }
  window.concluirTreinamento = async function(treinamentoId){
    try{
      await addDoc(collection(dbF,'portal_treinamento_conclusoes'), {
        funcionarioId: funcionarioIdAtual, treinamentoId: treinamentoId,
        dataConclusao: new Date().toISOString().slice(0,10)
      });
      await carregarConclusoes();
      desenharTreinamentos();
      renderDashboard();
      renderPerfilView();
    }catch(e){ alert('Não foi possível registrar a conclusão agora.'); }
  };

  // ===== Comunicados =====
  function renderComunicadosView(){
    const cont = document.getElementById('view-comunicados');
    cont.innerHTML = '<div class="sub-topo"><h2>Comunicados</h2></div><div id="comunicados-lista"></div>';
    desenharComunicados();
  }
  function comunicadosVisiveisParaMim(){
    const hoje = new Date().toISOString().slice(0,10);
    const meuSetorNorm = normalizar(perfilAtual.setor);
    return listaComunicados.filter(function(c){
      if(c.agendadoPara && c.agendadoPara>hoje) return false;
      if(!c.setores || !c.setores.length) return true;
      return c.setores.some(function(s){ return normalizar(s)===meuSetorNorm; });
    });
  }
  function desenharComunicados(){
    const cont = document.getElementById('comunicados-lista');
    const visiveis = comunicadosVisiveisParaMim();
    if(!visiveis.length){ cont.innerHTML = '<div class="vazio">Nenhum comunicado no momento.</div>'; return; }
    const ordenados = visiveis.slice().sort(function(a,b){
      const pf = (b.fixado?1:0)-(a.fixado?1:0);
      if(pf!==0) return pf;
      return (b.data||'').localeCompare(a.data||'');
    });
    cont.innerHTML = ordenados.map(function(c, i){
      const imagens = imagensDoComunicado(c);
      let blocoImagens = '';
      if(imagens.length === 1){
        blocoImagens = '<img src="'+escaparHtml(imagens[0])+'" alt="">';
      }else if(imagens.length > 1){
        // Várias imagens viram um carrossel que desliza para o lado, com encaixe por foto.
        blocoImagens = '<div class="carrossel">'+
          imagens.map(function(url){ return '<img src="'+escaparHtml(url)+'" alt="">'; }).join('')+
        '</div><div class="carrossel-dica">Arraste para o lado · '+imagens.length+' imagens</div>';
      }
      const texto = c.texto || '';
      const longo = texto.length > 320;
      return '<div class="feed-item'+(c.fixado?' fixado':'')+'">'+
        (c.fixado?('<div class="fix-badge">'+icone('pin')+' Fixado</div>'):'')+
        (c.setores&&c.setores.length?('<div class="fix-badge">Para: '+c.setores.join(', ')+'</div>'):'')+
        '<div class="meta"><span>'+(c.autor||'Pão & Tradição')+'</span><span>'+formatarDataBR(c.data)+'</span></div>'+
        '<h4>'+(c.titulo||'')+'</h4>'+
        blocoImagens+
        '<div class="feed-texto'+(longo?' cortado':'')+'" id="texto-com-'+i+'">'+textoComLinks(texto)+'</div>'+
        (longo?('<button class="btn-vermais" id="btn-com-'+i+'" onclick="alternarTextoComunicado('+i+')">Ver mais</button>'):'')+
        botoesDeLink(c)+
      '</div>';
    }).join('');
  }

  // Cada linha "Texto do botão | endereço" vira um botão, igual aos de cursos.
  function linksDoComunicado(c){
    if(Array.isArray(c.links) && c.links.length) return c.links.filter(function(l){ return l && l.url; });
    if(c.link) return [{ texto: c.linkTexto || 'Ver publicação original', url: c.link }];
    return [];
  }
  function botoesDeLink(c){
    const links = linksDoComunicado(c);
    if(!links.length) return '';
    return '<div class="acoes" style="margin-top:.7rem">'+links.map(function(l){
      return '<a class="btn btn-outline btn-sm" href="'+escaparHtml(l.url)+'" target="_blank" rel="noopener">'+escaparHtml(l.texto || 'Abrir link')+'</a>';
    }).join('')+'</div>';
  }
  function imagensDoComunicado(c){
    // Compatível com os comunicados antigos, que tinham uma imagem só no campo "imagem".
    if(Array.isArray(c.imagens) && c.imagens.length) return c.imagens.filter(Boolean);
    return c.imagem ? [c.imagem] : [];
  }
  // Escapa o texto (para um "<" não quebrar a tela) e transforma endereços em links clicáveis.
  function textoComLinks(texto){
    return escaparHtml(texto).replace(/(https?:\/\/[^\s<]+)/g, function(url){
      return '<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>';
    });
  }
  window.alternarTextoComunicado = function(i){
    const bloco = document.getElementById('texto-com-'+i);
    const botao = document.getElementById('btn-com-'+i);
    if(!bloco || !botao) return;
    const cortado = bloco.classList.toggle('cortado');
    botao.textContent = cortado ? 'Ver mais' : 'Ver menos';
  };

  // ===== Perguntas frequentes =====
  // Estrutura coringa: cada assunto (Férias, Atestado, Licença-maternidade...) tem um conteúdo
  // dividido em seções. No painel, você escreve seções começando a linha com ##, assim:
  //   ## Como funciona
  //   texto...
  //   ## Prazo
  //   texto...
  // Serve para qualquer assunto sem precisar mexer no portal.
  async function carregarFaq(){
    const snap = await getDocs(collection(dbF,'portal_faq'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    arr.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0) || (a.titulo||'').localeCompare(b.titulo||'','pt-BR'); });
    listaFaq = arr;
  }
  function secoesDoAssunto(conteudo){
    const linhas = String(conteudo||'').split('\n');
    const secoes = [];
    let atual = null;
    linhas.forEach(function(linha){
      const cabecalho = linha.match(/^\s*##\s*(.+)$/);
      if(cabecalho){
        atual = { titulo: cabecalho[1].trim(), texto: '' };
        secoes.push(atual);
      }else if(atual){
        atual.texto += (atual.texto?'\n':'')+linha;
      }else if(linha.trim()){
        // Texto antes da primeira seção vira uma introdução sem título.
        atual = { titulo:'', texto: linha };
        secoes.push(atual);
      }
    });
    return secoes.map(function(sec){ return { titulo: sec.titulo, texto: sec.texto.trim() }; })
                 .filter(function(sec){ return sec.titulo || sec.texto; });
  }
  function faqCombina(item, termo){
    if(!termo) return true;
    const alvo = normalizar([
      item.titulo || '',
      item.palavrasChave || '',
      item.conteudo || ''
    ].join(' '));
    return alvo.indexOf(termo) >= 0;
  }

    cont.innerHTML = '<div class="sub-topo"><h2>Perguntas frequentes</h2></div>'+

      '<input class="filtro-busca" id="faq-busca" placeholder="Ex: atestado, férias, licença..." oninput="filtrarFaq(this.value)">'+
      '<div id="faq-lista"></div>';
    desenharFaq('');
  }

  function desenharFaq(q){
    const cont = document.getElementById('faq-lista');
    if(!cont) return;
    const termo = normalizar(q);
    const ativos = listaFaq.filter(function(f){ return f.ativo!==false && faqCombina(f, termo); });
    if(!ativos.length){
      cont.innerHTML = '<div class="vazio">'+
        (termo ? 'Nada encontrado sobre isso. Use o botão "Falar com o Administrativo", na aba Documentos, para perguntar.' : 'Nenhum assunto publicado ainda.')+
      '</div>';
      return;
    }
    // Dois níveis: o assunto abre a lista de perguntas, e cada pergunta abre o texto.
    // Assim uma tela com muitos assuntos continua curta e fácil de varrer.
    cont.innerHTML = ativos.map(function(f){
      const secoes = secoesDoAssunto(f.conteudo);
      const perguntas = secoes.map(function(sec){
        if(!sec.titulo) return '<div class="faq-texto" style="margin-bottom:.6rem">'+textoComLinks(sec.texto)+'</div>';
        return '<div class="faq-pergunta">'+
          '<div class="faq-pergunta-topo" onclick="alternarGrupo(this)">'+
            '<span>'+escaparHtml(sec.titulo)+'</span>'+icone('seta')+
          '</div>'+
          '<div class="faq-pergunta-corpo"><div class="faq-texto">'+textoComLinks(sec.texto)+'</div></div>'+
        '</div>';
      }).join('');
      // Muitos links viravam um paredão de botões. Agora ficam recolhidos como as perguntas.
      const links = linksDoComunicado(f);
      const blocoLinks = links.length ? ('<div class="faq-pergunta">'+
        '<div class="faq-pergunta-topo" onclick="alternarGrupo(this)">'+
          '<span>Links úteis ('+links.length+')</span>'+icone('seta')+
        '</div>'+
        '<div class="faq-pergunta-corpo"><div class="faq-links">'+
          links.map(function(l){
            return '<a href="'+escaparHtml(l.url)+'" target="_blank" rel="noopener">'+escaparHtml(l.texto||'Abrir link')+icone('seta')+'</a>';
          }).join('')+
        '</div></div>'+
      '</div>') : '';
      const rodape = blocoLinks+
        '<button class="faq-nao-resolveu" onclick="naoResolveuDuvida(\''+escaparAspas(f.titulo||'')+'\')">Não resolveu minha dúvida</button>';
      // Fechado por padrão; com busca ativa, abre para a pessoa já ver o que encontrou.
      return '<div class="faq-assunto">'+blocoColapsavel(f.titulo || 'Assunto', secoes.length, !!termo, perguntas + rodape)+'</div>';
    }).join('');
  }

  // ===== Foto do perfil =====
  // A imagem é reduzida e recortada em quadrado aqui no celular antes de subir: uma foto de
  // 4 MB da câmera vira uns 15 KB, que é o que a ficha aguenta sem pesar no login de todo dia.
  const FOTO_LADO = 240;
  function reduzirImagem(arquivo){
    return new Promise(function(resolve, reject){
      const leitor = new FileReader();
      leitor.onload = function(){
        const img = new Image();
        img.onload = function(){
          const lado = Math.min(img.width, img.height);
          const canvas = document.createElement('canvas');
          canvas.width = FOTO_LADO;
          canvas.height = FOTO_LADO;
          const ctx = canvas.getContext('2d');
          // Recorta o meio da foto, para o rosto não ficar torto no círculo.
          ctx.drawImage(img, (img.width-lado)/2, (img.height-lado)/2, lado, lado, 0, 0, FOTO_LADO, FOTO_LADO);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = function(){ reject(new Error('imagem inválida')); };
        img.src = leitor.result;
      };
      leitor.onerror = function(){ reject(new Error('falha ao ler')); };
      leitor.readAsDataURL(arquivo);
    });
  }

  // Identifica o aparelho a partir do que o navegador já informa. Nada é pedido à pessoa.
  function descreverAparelho(){
    const ua = navigator.userAgent || '';
    let sistema = 'Outro';
    if(/iPhone|iPad|iPod/i.test(ua)) sistema = 'iPhone/iPad';
    else if(/Android/i.test(ua)) sistema = 'Android';
    else if(/Windows/i.test(ua)) sistema = 'Windows';
    else if(/Mac OS/i.test(ua)) sistema = 'Mac';
    let navegador = 'Outro';
    if(/SamsungBrowser/i.test(ua)) navegador = 'Samsung Internet';
    else if(/Edg\//i.test(ua)) navegador = 'Edge';
    else if(/OPR\//i.test(ua)) navegador = 'Opera';
    else if(/Chrome\//i.test(ua)) navegador = 'Chrome';
    else if(/Firefox\//i.test(ua)) navegador = 'Firefox';
    else if(/Safari\//i.test(ua)) navegador = 'Safari';
    const instalado = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    return { sistema: sistema, navegador: navegador, comoAbriu: instalado ? 'aplicativo instalado' : 'navegador' };
  }

  async function renderAdminAvaliacoes(){
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio">Carregando...</div>';
    let itens = [];
    try{
      const snap = await getDocs(collection(dbF,'portal_feedback'));
      snap.forEach(function(d){ itens.push(Object.assign({_id:d.id}, d.data())); });
    }catch(e){ cont.innerHTML = '<div class="vazio">Não foi possível carregar agora.</div>'; return; }
    if(!itens.length){ cont.innerHTML = '<div class="vazio">Ninguém avaliou ainda.</div>'; return; }
    itens.sort(function(a,b){ return (b.enviadoEm||'').localeCompare(a.enviadoEm||''); });
    const comNota = itens.filter(function(i){ return i.estrelas; });
    const media = comNota.length ? (comNota.reduce(function(t,i){ return t+Number(i.estrelas); },0)/comNota.length) : 0;
    // Distribuição das notas, para enxergar se a média esconde extremos.
    const barras = [5,4,3,2,1].map(function(n){
      const qtd = comNota.filter(function(i){ return Number(i.estrelas)===n; }).length;
      const pct = comNota.length ? Math.round(qtd/comNota.length*100) : 0;
      return '<div class="barra-nota"><span class="rot">'+n+'</span>'+
        '<span class="trilho"><span class="preenchida" style="width:'+pct+'%"></span></span>'+
        '<span class="qtd">'+qtd+'</span></div>';
    }).join('');
    cont.innerHTML =
      '<div class="perfil-stats">'+
        statBox(media?media.toFixed(1).replace('.',','):'—','Nota média')+
        statBox(comNota.length,'Avaliações')+
        statBox(itens.filter(function(i){ return i.sugestao; }).length,'Sugestões')+
      '</div>'+
      '<div style="margin:1.2rem 0">'+barras+'</div>'+
      '<h3 style="margin:1.4rem 0 .6rem;font-size:1rem">O que disseram</h3>'+
      (itens.filter(function(i){ return i.sugestao; }).length ? itens.filter(function(i){ return i.sugestao; }).map(function(i){
        return '<div class="card" style="margin-bottom:.7rem">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.4rem">'+
            '<strong style="font-size:.85rem">'+(i.anonimo?'Anônimo':escaparHtml(i.nome||'Sem nome'))+'</strong>'+
            '<span style="font-size:.75rem;color:var(--texto-2)">'+(i.estrelas?(i.estrelas+' ★ · '):'')+formatarDataHoraBR(i.enviadoEm)+'</span>'+
          '</div>'+
          '<div style="font-size:.86rem;line-height:1.6;color:var(--texto-2);white-space:pre-wrap">'+escaparHtml(i.sugestao)+'</div>'+
        '</div>';
      }).join('') : '<div class="vazio">Nenhuma sugestão escrita até agora.</div>');
  }

  function formatarCPF(cpf){
    const n = String(cpf||'').replace(/\D/g,'');
    if(n.length!==11) return n || '—';
    return n.slice(0,3)+'.'+n.slice(3,6)+'.'+n.slice(6,9)+'-'+n.slice(9);
  }

        '<div class="btns">'+
          '<button class="btn-icon" onclick="abrirFormColaborador(\''+f._id+'\')">'+icone('editar')+'</button>'+

  window.filtrarColaboradores = function(q){
    const termo = normalizar(q);
    const digitos = String(q||'').replace(/\D/g,'');
    if(!termo){ desenharListaColaboradores(listaFuncionariosAdmin); return; }
    desenharListaColaboradores(listaFuncionariosAdmin.filter(function(f){
      const achouNome = normalizar(f.nome).indexOf(termo) >= 0;
      const achouCpf = digitos && String(f.cpf||'').replace(/\D/g,'').indexOf(digitos) >= 0;
      return achouNome || achouCpf;
    }));
