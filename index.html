<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Colaborador · Pão & Tradição</title>
<meta name="theme-color" content="#13215E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal Colaborador">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#13215E; --azul-2:#1c2f7a; --ouro:#EFAD4C; --ouro-claro:#FBF3E8;
    --creme:#F5F0DC; --texto-2:#5B7184; --texto-3:#8b95a8;
    --borda:#e9e6da; --borda-forte:#d8d3c0;
    --verde:#1D9E75; --vermelho:#C0392B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:#FCFCFB;color:var(--azul);min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;color:var(--azul);font-weight:700}
  a{color:inherit}
  .hidden{display:none!important}

  .topo-marca{background:var(--azul);padding:1.1rem 1.2rem;text-align:center;position:relative;overflow:hidden}
  .topo-marca::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,var(--ouro),var(--ouro-claro),var(--ouro))}
  .topo-marca h1{color:#fff;font-size:1.1rem;font-weight:800;letter-spacing:.02em}
  .topo-marca .sub{color:var(--ouro);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

  .wrap{max-width:520px;margin:0 auto;padding:1.6rem 1.1rem 3rem}
  .app-body{padding-top:1.2rem;padding-bottom:5.4rem}

  .card{background:#fff;border-radius:16px;padding:1.4rem;box-shadow:0 1px 3px rgba(19,33,94,.06);margin-bottom:1.1rem}

  label{display:block;font-size:.72rem;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
  input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--borda-forte);border-radius:9px;font-size:.9rem;margin-bottom:1.1rem;font-family:inherit;color:var(--azul);background:#fcfbf7;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ouro);background:#fff}
  textarea{min-height:90px;resize:vertical}
  input[type="checkbox"]{width:auto;margin:0}

  .btn{padding:9px 17px;border:none;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:background .15s}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-azul:hover{background:var(--azul-2)}
  .btn-outline{background:#fff;border:1px solid var(--borda-forte);color:var(--azul)}
  .btn-outline:hover{background:var(--ouro-claro)}
  .btn-sm{padding:6px 12px;font-size:.76rem}
  .btn-full{width:100%}

  .campo-senha{position:relative}
  .campo-senha input{padding-right:46px}
  .ver-senha{position:absolute;right:5px;top:6px;background:transparent;border:none;color:var(--texto-2);padding:6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ver-senha:hover{color:var(--azul);background:#F5F4F0}
  .ver-senha svg{width:19px;height:19px}

  .conversa{display:flex;flex-direction:column;gap:.55rem;max-height:45vh;overflow-y:auto;padding:.2rem}
  .balao{max-width:85%;padding:.6rem .8rem;border-radius:14px;font-size:.86rem;line-height:1.5}
  .balao.meu{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
  .balao.outro{align-self:flex-start;background:#F5F4F0;color:var(--azul);border-bottom-left-radius:4px}
  .balao-ref{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;margin-bottom:.25rem}
  .balao-texto{white-space:pre-wrap}
  .balao-hora{font-size:.68rem;opacity:.7;margin-top:.3rem}

  .dica-campo{font-size:.75rem;color:var(--texto-2);line-height:1.5;margin:-.5rem 0 .5rem}

  .erro{color:var(--vermelho);font-size:.83rem;margin-bottom:.7rem;min-height:1rem;font-weight:500}
  .login-hint{font-size:.78rem;color:var(--texto-2);text-align:center;margin-top:.9rem;line-height:1.5}
  .link-alternar{display:block;width:100%;background:transparent;border:none;color:var(--texto-2);font-size:.78rem;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-top:.9rem;padding:0;font-family:inherit}
  .link-alternar:hover{color:var(--azul)}

  .doc-tipo{font-size:.74rem;font-weight:800;color:var(--ouro);margin:1.2rem 0 .6rem;text-transform:uppercase;letter-spacing:.06em}
  .doc-tipo:first-child{margin-top:0}
  .doc-item{display:flex;justify-content:space-between;align-items:center;gap:.7rem;padding:.75rem 0;border-bottom:1px solid #F0EFEA;font-size:.92rem}

  .grupo-ano{margin-bottom:.2rem}
  .grupo-ano-cabecalho{display:flex;justify-content:space-between;align-items:center;padding:.65rem 0;cursor:pointer;border-bottom:1px solid #F0EFEA;font-size:.86rem;font-weight:700;color:var(--azul)}
  .grupo-ano-cabecalho .num{display:flex;align-items:center;gap:4px;color:var(--texto-2);font-size:.75rem;font-weight:600}
  .grupo-ano-cabecalho .num svg{width:15px;height:15px;transition:transform .15s}
  .grupo-ano-cabecalho.aberto .num svg{transform:rotate(90deg)}
  .grupo-ano-corpo{display:none;padding-left:.1rem}
  .grupo-ano-corpo.aberto{display:block}
  .doc-item:last-child{border-bottom:none}
  .doc-item .ref{font-weight:600}

  .vazio{color:var(--texto-3);font-size:.86rem;padding:1.4rem 0;text-align:center}
  .rodape{text-align:center;font-size:.72rem;color:var(--texto-3);margin-top:1.6rem}

  /* Topo do app (logado) */
  .app-top{background:#fff;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;position:sticky;top:0;z-index:80;border-bottom:1px solid #F0EFEA}
  .app-top .logo-mini{color:var(--azul);font-weight:800;font-size:.92rem}
  .app-top-acoes{display:flex;align-items:center;gap:.3rem}
  .icon-btn{background:transparent;border:none;color:var(--azul);padding:7px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:#F5F4F0}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.escuro{color:var(--azul)}
  .busca-caixa{position:relative}
  .busca-input{display:none;position:absolute;right:0;top:40px;width:min(84vw,320px);background:#fff;border:1px solid var(--borda-forte);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:0;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .busca-input.aberta{display:block}
  .busca-resultados{position:absolute;right:0;top:88px;width:min(84vw,320px);background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:90;max-height:320px;overflow:auto}
  .busca-item{padding:.6rem .8rem;border-bottom:1px solid var(--borda);font-size:.82rem;cursor:pointer}
  .busca-item:last-child{border-bottom:none}
  .busca-item:hover{background:var(--ouro-claro)}
  .busca-item .tipo{font-size:.63rem;text-transform:uppercase;color:var(--texto-2);font-weight:800;letter-spacing:.04em}

  /* Navegação inferior */
  .navbar-inferior{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borda);display:flex;z-index:70;padding-bottom:env(safe-area-inset-bottom)}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--texto-3);font-size:.6rem;font-weight:700;cursor:pointer;border:none;background:transparent;font-family:inherit}
  .nav-item svg{width:20px;height:20px}
  .nav-item.ativa{color:var(--azul)}

  /* Views */
  .view{display:none}
  .view.ativa{display:block}

  .dash-banner{background:#fff;color:var(--azul);border-radius:14px;padding:.9rem 1.05rem;margin-bottom:.8rem;border-left:3px solid var(--ouro);box-shadow:0 1px 3px rgba(19,33,94,.05)}

  .campanha-banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:1.1rem;cursor:pointer;box-shadow:0 1px 3px rgba(19,33,94,.08);min-height:130px;background:var(--azul)}
  .campanha-banner img{width:100%;height:150px;object-fit:cover;display:block}
  .campanha-rotulo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(19,33,94,.92),rgba(19,33,94,.15) 80%,transparent);color:#fff;padding:2.2rem .9rem .8rem}
  .campanha-tag{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ouro);margin-bottom:.2rem}
  .campanha-rotulo h3{color:#fff;font-size:1rem}
  .dash-banner h3{color:var(--azul);font-size:.92rem;margin-bottom:.2rem}
  .dash-banner p{margin:0;font-size:.82rem;line-height:1.5;color:var(--texto-2)}

  .dash-saudacao{margin-bottom:1.1rem}
  .dash-saudacao h1{font-size:1.3rem}
  .dash-saudacao p{color:var(--texto-2);margin:2px 0 0;font-size:.85rem}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .dash-card{background:#fff;border-radius:16px;padding:1.2rem 1rem;box-shadow:0 1px 3px rgba(19,33,94,.06);cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:.6rem}
  .dash-card:hover{box-shadow:0 4px 14px rgba(19,33,94,.1)}
  .dash-card:active{transform:scale(.97)}
  .dash-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#F5F4F0;color:var(--azul)}
  .dash-card .ic svg{width:19px;height:19px}
  .dash-card h4{font-size:.86rem}
  .dash-card .contagem{font-size:.72rem;color:var(--texto-2)}
  .dash-card.c-neutro .ic{background:#F5F4F0;color:var(--azul)}

  .sub-topo{margin-bottom:1rem}
  .sub-topo h2{font-size:1.15rem}

  .filtro-busca{width:100%;padding:9px 12px;border:1px solid var(--borda-forte);border-radius:9px;font-size:.85rem;margin-bottom:1rem;font-family:inherit}

  .card-item{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:1rem;box-shadow:0 1px 3px rgba(19,33,94,.06)}
  .card-item img{width:100%;height:130px;object-fit:cover;display:block;background:var(--ouro-claro)}
  .card-item .corpo{padding:1rem}
  .card-item h4{font-size:.96rem;margin-bottom:.3rem}
  .card-item .categoria{font-size:.66rem;font-weight:800;color:var(--ouro);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
  .card-item p{font-size:.83rem;color:var(--texto-2);margin:0 0 .8rem;line-height:1.45}
  .card-item .acoes{display:flex;flex-wrap:wrap;gap:.5rem}

  .concluido-tag{display:inline-flex;align-items:center;gap:5px;color:var(--verde);font-weight:700;font-size:.78rem}
  .concluido-tag svg{width:15px;height:15px}

  .feed-item{background:#fff;border-radius:16px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(19,33,94,.06)}
  .feed-item.fixado{background:#fff;border-left:3px solid var(--ouro)}
  .feed-item img{width:100%;max-height:320px;object-fit:contain;border-radius:9px;margin:.5rem 0;display:block;background:var(--ouro-claro)}
  .feed-item .meta{font-size:.72rem;color:var(--texto-2);display:flex;justify-content:space-between;margin-bottom:.4rem}
  .feed-item .fix-badge{display:inline-flex;align-items:center;gap:4px;color:#8a5a00;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
  .feed-item .fix-badge svg{width:13px;height:13px}
  .feed-item h4{font-size:.95rem;margin-bottom:.4rem}
  .feed-item p{font-size:.87rem;line-height:1.55;margin:0;white-space:pre-wrap}

  .perfil-cabecalho{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.1rem}
  .perfil-foto{width:88px;height:88px;border-radius:50%;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;overflow:hidden;margin-bottom:.7rem}
  .perfil-foto img{width:100%;height:100%;object-fit:cover}
  .perfil-cargo{color:var(--texto-2);font-size:.85rem;margin-top:2px}
  .perfil-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:.7rem;margin-top:1rem}
  .perfil-stat{background:#fff;border-radius:14px;padding:1rem;text-align:center;box-shadow:0 1px 3px rgba(19,33,94,.05)}
  .perfil-stat .num{font-size:1.3rem;font-weight:800;color:var(--azul)}
  .perfil-stat .lbl{font-size:.68rem;color:var(--texto-2);text-transform:uppercase;font-weight:700;letter-spacing:.03em}

  /* Painel Administrativo */
  .admin-shell{position:fixed;inset:0;background:#FCFCFB;z-index:150;display:none;flex-direction:column}
  .admin-shell.aberta{display:flex}
  .admin-top{background:var(--azul);color:#fff;padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .admin-top h2{color:#fff;font-size:1rem}
  .admin-tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 1rem;background:#fff;border-bottom:1px solid var(--borda);flex-shrink:0}
  .admin-tab-btn{white-space:nowrap;padding:7px 13px;border-radius:20px;border:1px solid var(--borda-forte);background:#fff;font-size:.78rem;font-weight:700;color:var(--texto-2);cursor:pointer;font-family:inherit}
  .admin-tab-btn.ativa{background:var(--azul);color:#fff;border-color:var(--azul)}
  .admin-conteudo{flex:1;overflow:auto;padding:1.1rem 1.1rem 6rem;max-width:640px;margin:0 auto;width:100%}
  .admin-lista-item{background:#fff;border-radius:14px;padding:.85rem .95rem;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;box-shadow:0 1px 3px rgba(19,33,94,.05)}
  .admin-lista-item .info{flex:1;min-width:0}
  .admin-lista-item .info h5{font-size:.88rem;margin-bottom:2px;font-weight:700}
  .admin-lista-item .info small{color:var(--texto-2);font-size:.72rem}
  .admin-lista-item .btns{display:flex;gap:.4rem;flex-shrink:0}
  .btn-icon{background:#fff;border:1px solid var(--borda-forte);border-radius:8px;padding:6px;display:flex;cursor:pointer}
  .btn-icon svg{width:16px;height:16px}
  .btn-icon.perigo{color:var(--vermelho);border-color:#e9c6c0}
  .btn-fab{position:fixed;right:1.1rem;bottom:5.6rem;background:var(--azul);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(19,33,94,.35);cursor:pointer;z-index:60}
  .btn-fab svg{width:22px;height:22px}
  .btn-fab-admin{position:fixed;right:1.4rem;bottom:1.4rem}
  .checkbox-linha{display:flex;align-items:center;gap:8px;margin-bottom:1.1rem;font-size:.85rem;font-weight:500}
  .form-linha2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .form-linha2 > div{min-width:0}

  .filtros-chips{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
  .chip{border:1px solid var(--borda);background:#fff;color:var(--texto-2);font-size:.8rem;font-weight:700;padding:.45rem .9rem;border-radius:20px;cursor:pointer;font-family:inherit}
  .chip.ativo{background:var(--azul);border-color:var(--azul);color:#fff}

  /* Revisão do envio em lote */
  .lote-item{background:#fff;border-radius:14px;padding:.9rem;margin-bottom:.7rem;box-shadow:0 1px 3px rgba(19,33,94,.05)}
  .lote-item.apagado{opacity:.5}
  .lote-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;margin-bottom:.6rem}
  .lote-topo .checkbox-linha span{font-weight:700;font-size:.86rem;text-transform:none;letter-spacing:0}
  .lote-campos{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .lote-campos select,.lote-campos input{margin-bottom:0}
  .lote-rodape{font-size:.72rem;color:var(--texto-2);margin-top:.6rem}
  .lote-acoes{display:flex;gap:.6rem;margin-top:1.2rem}
  .lote-acoes .btn{flex:1}
  .selo{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .selo-ok{background:#E6F5EF;color:#12775A}
  .selo-aviso{background:#FBF3E8;color:#8a5a00}
  .selo-erro{background:#FBEAE7;color:var(--vermelho)}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(19,33,94,.55);z-index:210;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.aberto{display:flex}
  .modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:1.3rem}
  .modal-box .topo-modal{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem}
  .modal-box .topo-modal h3{font-size:1.02rem}

  /* Visualizador de PDF embutido */
  #visualizador-overlay{position:fixed;inset:0;background:rgba(19,33,94,.85);z-index:220;display:none;flex-direction:column}
  #visualizador-overlay.aberto{display:flex}
  .visualizador-topo{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:var(--azul);flex-shrink:0}
  .visualizador-topo span{color:#fff;font-weight:600;font-size:.9rem}
  .visualizador-fechar{background:transparent!important;border:1px solid #fff!important;color:#fff!important}
  #visualizador-paginas{flex:1;overflow:auto;background:#5B5B5B;padding:1rem 0;text-align:center}
  #visualizador-paginas canvas{max-width:96%;height:auto!important;margin-bottom:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.3);background:#fff}
  #visualizador-carregando{color:#fff;padding:2rem;font-size:.9rem}
</style>
</head>
<body>

<div class="topo-marca">
  <h1>Pão &amp; Tradição</h1>
  <div class="sub">Portal do Colaborador</div>
</div>

<div class="wrap" id="tela-login">
  <div class="card" id="tela-login-card">
    <div class="erro" id="login-erro"></div>
    <form id="form-login" onsubmit="event.preventDefault(); fazerLoginPortal();">
      <div id="campos-colaborador">
        <label>Primeiro nome</label>
        <input type="text" id="login-nome" name="username" placeholder="Digite seu primeiro nome" autocomplete="username">
        <label>CPF</label>
        <div class="campo-senha">
          <input type="password" id="login-cpf" name="password" placeholder="Só números" inputmode="numeric" autocomplete="current-password">
          <button type="button" class="ver-senha" id="btn-ver-cpf" aria-label="Mostrar CPF" onclick="alternarVerSenha('login-cpf', this)"></button>
        </div>
      </div>
      <div id="campos-admin" class="hidden">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="E-mail de administrador" autocomplete="username">
        <label>Senha</label>
        <div class="campo-senha">
          <input type="password" id="login-senha" placeholder="Senha de administrador" autocomplete="current-password">
          <button type="button" class="ver-senha" id="btn-ver-senha" aria-label="Mostrar senha" onclick="alternarVerSenha('login-senha', this)"></button>
        </div>
      </div>
      <button type="submit" class="btn btn-azul btn-full">Entrar</button>
    </form>
    <button type="button" class="btn btn-outline btn-full" id="btn-instalar-app" onclick="instalarApp()" style="margin-top:.9rem">Instalar aplicativo no celular</button>
    <button type="button" class="link-alternar" id="btn-alternar-login" onclick="alternarModoLoginAdmin()">Entrar como administrador (RH)</button>
    <div class="login-hint" id="login-hint">Use seu primeiro nome e o CPF (só números) para entrar.<br>Em caso de dúvida, procure o RH.</div>
  </div>
</div>

<div id="app-shell" style="display:none">
  <div class="app-top">
    <div class="logo-mini">Portal do Colaborador</div>
    <div class="app-top-acoes">
      <div class="busca-caixa">
        <button class="icon-btn" onclick="toggleBusca()"><span id="busca-btn-icone"></span></button>
        <input class="busca-input" id="busca-input" placeholder="Buscar documentos, benefícios..." oninput="buscarGlobal(this.value)">
        <div class="busca-resultados" id="busca-resultados"></div>
      </div>
      <button class="icon-btn" onclick="sairPortal()"><span id="sair-icone"></span></button>
    </div>
  </div>

  <div class="wrap app-body">
    <div class="view ativa" id="view-dashboard"></div>
    <div class="view" id="view-documentos"></div>

      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')

  function formatarDataBR(iso){
    if(!iso) return '—';
    const p = String(iso).slice(0,10).split('-');
    return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso;
  }
  function base64ParaBlob(base64, tipoMime){
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for(let i=0;i<binario.length;i++) bytes[i]=binario.charCodeAt(i);
    return new Blob([bytes], { type: tipoMime||'application/pdf' });
  }
  function valorAttr(v){ return String(v||'').replace(/"/g,'&quot;'); }
  function formatarDataHoraBR(iso){
    if(!iso) return '';
    const d = new Date(iso);

    return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  function escaparAspas(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
  // Para textos que vão dentro de HTML gerado (folha de impressão), evitando que um "<" quebre a página.
  function escaparHtml(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    if(h<18) return 'Boa tarde';
    return 'Boa noite';

  function calcularTempoEmpresa(iso){
    if(!iso) return '';
    const inicio = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(inicio.getTime())) return '';
    const agora = new Date();
    let anos = agora.getFullYear()-inicio.getFullYear();
    let meses = agora.getMonth()-inicio.getMonth();
    if(agora.getDate()<inicio.getDate()) meses--;
    if(meses<0){ anos--; meses+=12; }
    if(anos<0) return '';
    const partes=[];
    if(anos>0) partes.push(anos+(anos===1?' ano':' anos'));
    if(meses>0||partes.length===0) partes.push(meses+(meses===1?' mês':' meses'));
    return partes.join(' e ');
  }

    if(!iso) return 0;

    const agora = new Date();
    let anos = agora.getFullYear()-inicio.getFullYear();

    if(isNaN(d.getTime())) return false;
    return d.getMonth() === new Date().getMonth();
  }
  function arquivoParaBase64(file){
    return new Promise(function(resolve,reject){
      const reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);

    document.getElementById('login-erro').textContent = '';

  window.fazerLoginPortal = async function(){
    const erro = document.getElementById('login-erro');
    erro.textContent = '';
    if(modoLoginAdmin){
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      if(!email || !senha){ erro.textContent='Preencha o e-mail e a senha.'; return; }
      try{ await signInWithEmailAndPassword(auth, email, senha); }
      catch(e){ erro.textContent = 'E-mail ou senha incorretos.'; }
      return;
    }
    const nome = document.getElementById('login-nome').value;
    const cpf = document.getElementById('login-cpf').value.replace(/\D/g,'');
    if(!nome.trim() || cpf.length!==11){ erro.textContent='Preencha o nome e o CPF (11 números).'; return; }

    try{
      await signInWithEmailAndPassword(auth, emailPorCpf(cpf), cpf);
      return;
    }catch(e){ /* pode ser um acesso antigo, ainda montado pelo nome */ }
    for(let v = 1; v <= MAX_VARIACOES_LOGIN; v++){
      try{
        await signInWithEmailAndPassword(auth, emailDoColaborador(nome, v), cpf);
        return;
      }catch(e){ /* tenta a próxima variação */ }
    }
    nomeDigitadoLogin = '';
    erro.textContent = 'Nome ou CPF incorretos, ou o acesso ainda não foi criado pelo RH.';
  };

  // ===== Visualizador de documentos (PDF em base64) =====
  // Usado tanto pelo colaborador quanto pelo painel administrativo.
  async function abrirVisualizadorPdf(base64, titulo){
    if(!base64) return;
    document.getElementById('visualizador-titulo').textContent = titulo || 'Documento';
    const cont = document.getElementById('visualizador-paginas');
    cont.innerHTML = '<div id="visualizador-carregando">Carregando...</div>';
    document.getElementById('visualizador-overlay').classList.add('aberto');
    try{
      const bytes = base64ParaBlob(base64);
      const buffer = await bytes.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      cont.innerHTML = '';
      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        cont.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
      }
    }catch(e){
      cont.innerHTML = '<div id="visualizador-carregando">Não foi possível abrir esse documento. Tente baixar em vez de ver.</div>';
    }
  }
  window.verDocumentoPortal = function(idx){
    const d = window._meusDocumentos[idx];
    if(!d) return;
    return abrirVisualizadorPdf(d.base64, d.referencia);
  };

  window.baixarDocumentoPortal = function(idx, ev){
    if(ev) ev.preventDefault();
    const d = window._meusDocumentos[idx];
    if(!d || !d.base64) return;
    const blob = base64ParaBlob(d.base64);
    const a = document.createElement('a');
    const objUrl = URL.createObjectURL(blob);
    a.href = objUrl;
    a.download = (d.nomeArquivo||'documento').replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(objUrl); }, 10000);
  };

  // Reconhece links de YouTube/Vimeo (e arquivos de vídeo diretos) e monta um player
  // embutido de verdade. Qualquer outro link (ex: OneDrive, Google Drive) não dá pra
  // garantir que embuta — nesses casos abre em uma aba nova.
  function obterEmbedVideo(url){
    if(!url) return null;
    const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([\w-]{6,})/);
    if(yt) return { tipo:'iframe', src:'https://www.youtube.com/embed/'+yt[1] };
    const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(vimeo) return { tipo:'iframe', src:'https://player.vimeo.com/video/'+vimeo[1] };
    const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if(drive) return { tipo:'iframe', src:'https://drive.google.com/file/d/'+drive[1]+'/preview' };
    if(/onedrive\.live\.com\/embed/i.test(url) || /\.sharepoint\.com\/.*\/embed/i.test(url)) return { tipo:'iframe', src:url };
    if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(url)) return { tipo:'direto', src:url };
    return null;
  }
  window.abrirVideo = function(url){
    const embed = obterEmbedVideo(url);

      // Sem autoplay: os navegadores bloqueiam início automático com som e o vídeo ficaria
      // parado no primeiro quadro, que costuma ser preto. playsinline evita o iPhone jogar
      // para tela cheia sozinho. Se o formato não for suportado, mostramos uma saída.
      corpo = '<video controls playsinline preload="metadata" style="width:100%;border-radius:10px;display:block;background:#000" src="'+embed.src+'" '+
        'onerror="document.getElementById(\'video-alternativa\').style.display=\'block\'"></video>'+

          '<a href="'+embed.src+'" target="_blank" rel="noopener" style="color:var(--azul);font-weight:700">Abrir em outra aba</a>'+
        '</div>';
    } else {
      corpo = '<div style="position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden">'+
        '<iframe src="'+embed.src+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>'+
      '</div>';
    }

    listaTreinamentos.forEach(function(t){ if(normalizar(t.titulo||'').indexOf(termo)>=0) resultados.push({tipo:(t.ehCurso?'Curso':'Treinamento'),titulo:t.titulo,view:'treinamentos'}); });

  // ===== Carregamento de dados =====
  async function carregarDocumentos(){
    const q = query(collection(dbF,'portal_documentos'), where('funcionarioId','==', funcionarioIdAtual));
    const snap = await getDocs(q);
    const arr = [];
    const agora = new Date().toISOString();
    snap.forEach(function(d){
      const dados = d.data();
      // Documento agendado ainda não aparece para o colaborador.
      if(dados.liberarEm && dados.liberarEm > agora) return;
      arr.push(dados);
    });
    listaDocumentos = arr;
    window._meusDocumentos = listaDocumentos;
  }
  async function carregarBeneficios(){
    const snap = await getDocs(collection(dbF,'portal_beneficios'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    listaBeneficios = arr;
  }
  async function carregarTreinamentos(){
    const snap = await getDocs(collection(dbF,'portal_treinamentos'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    listaTreinamentos = arr;
  }
  async function carregarComunicados(){
    const snap = await getDocs(collection(dbF,'portal_comunicados'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    listaComunicados = arr;
  }
  async function carregarConclusoes(){
    const q = query(collection(dbF,'portal_treinamento_conclusoes'), where('funcionarioId','==', funcionarioIdAtual));
    const snap = await getDocs(q);
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    listaConclusoes = arr;
  }
  async function carregarCampanha(){
    const snap = await getDoc(doc(dbF,'portal_campanha','atual'));
    campanhaMes = snap.exists() ? snap.data() : null;
  }
  async function carregarFuncionariosAdmin(forcar){
    if(listaFuncionariosAdmin.length && !forcar) return;
    const snap = await getDocs(collection(dbF,'portal_funcionarios'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    // Cada reset de acesso no RH cria um login novo sem apagar o antigo, então o mesmo
    // funcionário pode aparecer mais de uma vez aqui. Como documentos são ligados por
    // funcionarioId (não pelo login em si), mantemos só um registro por funcionarioId.
    const vistos = {};
    const semDuplicados = [];
    arr.forEach(function(f){
      const chave = f.funcionarioId || f._id;
      if(vistos[chave]) return;
      vistos[chave] = true;
      semDuplicados.push(f);
    });
    semDuplicados.sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
    listaFuncionariosAdmin = semDuplicados;
  }
  async function carregarTudo(){
    // Promise.allSettled (não Promise.all): se alguma coleção falhar (ex: permissão do
    // Firestore ainda não liberada para algo novo), as outras continuam funcionando —
    // em vez de travar a tela inteira em branco por causa de uma coleção só.
    const resultados = await Promise.allSettled([
      carregarDocumentos(), carregarBeneficios(),
      carregarTreinamentos(), carregarComunicados(), carregarConclusoes(), carregarCampanha(), carregarMinhaDuvida()
    ]);
    const nomes = ['documentos','benefícios','treinamentos','comunicados','conclusões de treinamento','campanha do mês','dúvidas'];
    const falhas = [];
    resultados.forEach(function(r, i){
      if(r.status==='rejected'){
        console.error('Falha ao carregar '+nomes[i]+':', r.reason);
        falhas.push(nomes[i]);
      }
    });
    return falhas;
  }

  // Bloco de ano que abre/fecha — evita listas gigantes quando acumula muito envio ao longo dos anos.
  window.alternarGrupo = function(headerEl){
    headerEl.classList.toggle('aberto');

  function blocoColapsavel(titulo, quantidade, aberto, corpoHtml){
    return '<div class="grupo-ano">'+
      '<div class="grupo-ano-cabecalho'+(aberto?' aberto':'')+'" onclick="alternarGrupo(this)">'+
        '<span>'+titulo+'</span><span class="num">'+quantidade+(quantidade===1?' item ':' itens ')+icone('seta')+'</span>'+
      '</div>'+
      '<div class="grupo-ano-corpo'+(aberto?' aberto':'')+'">'+corpoHtml+'</div>'+
    '</div>';

  const TIPOS_SEMPRE_FECHADOS = ['holerite_mensal','holerite_ferias','folha_ponto'];
  function desenharListaDocumentos(lista, forcarTudoAberto){
    const cont = document.getElementById('doc-lista-nova');
    if(!lista.length){ cont.innerHTML = '<div class="vazio">Nenhum documento encontrado.</div>'; return; }
    const anoAtual = String(new Date().getFullYear());
    const grupos = {};
    lista.forEach(function(d){
      const idx = listaDocumentos.indexOf(d);
      d._idx = idx;
      const ano = (d.enviadoEm||'').slice(0,4) || 'Sem data';
      const chaveTipo = d.tipo || 'outros';
      grupos[chaveTipo] = grupos[chaveTipo] || {};
      grupos[chaveTipo][ano] = grupos[chaveTipo][ano] || [];
      grupos[chaveTipo][ano].push(d);
    });
    let html = '';
    Object.keys(TIPOS).forEach(function(tipo){
      if(!grupos[tipo]) return;
      html += '<div class="doc-tipo">'+TIPOS[tipo]+'</div>';
      const anos = Object.keys(grupos[tipo]).sort().reverse();
      anos.forEach(function(ano){
        const itens = grupos[tipo][ano].slice().sort(function(a,b){ return (b.enviadoEm||'').localeCompare(a.enviadoEm||''); });
        const corpo = itens.map(function(d){
          return '<div class="doc-item"><span class="ref">'+(d.referencia||'—')+'</span><span style="display:flex;gap:.5rem">'+
            '<button class="btn btn-outline btn-sm" onclick="verDocumentoPortal('+d._idx+')">Ver</button>'+
            '<button class="btn btn-outline btn-sm" onclick="abrirMinhasDuvidas(\''+escaparAspas((TIPOS[d.tipo]||d.tipo)+' · '+(d.referencia||''))+'\')">Dúvida</button>'+
            '<button class="btn btn-outline btn-sm" onclick="baixarDocumentoPortal('+d._idx+',event)">Baixar</button>'+
          '</span></div>';
        }).join('');
        const abertoFinal = TIPOS_SEMPRE_FECHADOS.indexOf(tipo)>=0 ? (forcarTudoAberto || false) : (forcarTudoAberto || anos.length===1 || ano===anoAtual);
        html += blocoColapsavel(ano, itens.length, abertoFinal, corpo);
      });
    });
    cont.innerHTML = html || '<div class="vazio">Nenhum documento disponível ainda.</div>';
  }

  function suportaNotificacoes(){

  function chavePushEmBytes(){
    const normal = PUSH_CHAVE_PUBLICA.replace(/-/g,'+').replace(/_/g,'/');
    const completo = normal + '==='.slice((normal.length + 3) % 4);
    const bin = atob(completo);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function inscricaoAtual(){
    if(!suportaNotificacoes()) return null;
    try{
      const reg = await navigator.serviceWorker.ready;
      return await reg.pushManager.getSubscription();
    }catch(e){ return null; }
  }

    const titulo = '<label>Notificações no celular</label>';
    if(!suportaNotificacoes()){
      cont.innerHTML = titulo + '<p style="font-size:.83rem;color:var(--texto-2);line-height:1.6;margin:0">Este navegador não recebe notificações. No iPhone, instale o portal na tela de início pelo Safari e abra por lá.</p>';
      return;
    }
    if(Notification.permission === 'denied'){
      cont.innerHTML = titulo + '<p style="font-size:.83rem;color:var(--texto-2);line-height:1.6;margin:0">As notificações estão bloqueadas para este site. Libere nas configurações do navegador e volte aqui.</p>';
      return;
    }
    const inscricao = await inscricaoAtual();
    if(inscricao){
      cont.innerHTML = titulo +
        '<p style="font-size:.83rem;color:var(--verde);line-height:1.6;margin:0 0 .7rem">Ativadas. Você será avisado quando houver documento, comunicado ou curso novo.</p>'+
        '<button class="btn btn-outline btn-full" onclick="desativarNotificacoes()">Desativar</button>';
      return;
    }
    cont.innerHTML = titulo +
      '<p style="font-size:.83rem;color:var(--texto-2);line-height:1.6;margin:0 0 .7rem">Receba um aviso no celular quando o RH publicar algo novo.</p>'+
      '<button class="btn btn-azul btn-full" onclick="ativarNotificacoes()">Ativar notificações</button>'+
      '<div class="erro" id="notif-erro" style="margin:.6rem 0 0"></div>';
  }
  window.ativarNotificacoes = async function(){
    const erroEl = document.getElementById('notif-erro');
    if(erroEl){ erroEl.style.color='var(--vermelho)'; erroEl.textContent=''; }
    try{
      const permissao = await Notification.requestPermission();
      if(permissao !== 'granted'){
        if(erroEl) erroEl.textContent = 'Você precisa tocar em "Permitir" para receber os avisos.';
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const inscricao = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: chavePushEmBytes()
      });
      // Guardado com o id do login, para o painel saber para quais aparelhos avisar.
      await setDoc(doc(dbF,'portal_push', auth.currentUser.uid), {
        endpoint: inscricao.endpoint,
        funcionarioId: funcionarioIdAtual,
        nome: perfilAtual.nome || '',
        criadoEm: new Date().toISOString()
      });
      desenharCartaoNotificacoes();
    }catch(e){
      console.error(e);
      if(erroEl) erroEl.textContent = 'Não foi possível ativar agora. Tente de novo mais tarde.';
    }
  };
  window.desativarNotificacoes = async function(){
    try{
      const inscricao = await inscricaoAtual();
      if(inscricao) await inscricao.unsubscribe();
      await deleteDoc(doc(dbF,'portal_push', auth.currentUser.uid));
    }catch(e){ console.warn('Falha ao desativar notificações', e); }
    desenharCartaoNotificacoes();
  };

  // Lado do RH: escolhe o que foi atualizado, grava o recado e avisa os aparelhos inscritos.
  const AREAS_AVISO = [
    ['documento',   'Documentos',   'um novo documento foi anexado'],
    ['comunicado',  'Comunicados',  'um novo comunicado foi publicado'],
    ['curso',       'Cursos',       'um novo curso foi liberado'],
    ['treinamento', 'Treinamentos', 'um novo treinamento foi liberado']
  ];
  function montarMensagemAviso(chaves){
    const trechos = AREAS_AVISO.filter(function(a){ return chaves.indexOf(a[0]) >= 0; }).map(function(a){ return a[2]; });
    if(!trechos.length) return null;
    let frase;
    if(trechos.length === 1) frase = trechos[0];
    else frase = trechos.slice(0,-1).join(', ') + ' e ' + trechos[trechos.length-1];
    // A frase começa a notificação, então entra com maiúscula.
    frase = frase.charAt(0).toUpperCase() + frase.slice(1);
    return {
      titulo: trechos.length === 1 ? 'Há novidade para você!' : 'Há novidades para você!',
      mensagem: frase + '. Toque para abrir.'
    };
  }
  window.avisarColaboradores = async function(){
    const status = document.getElementById('aviso-status');
    status.style.color = 'var(--texto-2)';
    status.textContent = '';
    const marcadas = AREAS_AVISO.filter(function(a){
      const el = document.getElementById('aviso-'+a[0]);
      return el && el.checked;
    }).map(function(a){ return a[0]; });
    const recado = montarMensagemAviso(marcadas);
    if(!recado){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Marque pelo menos uma área atualizada.';
      return;
    }
    if(PUSH_ENDERECO.indexOf('COLE_AQUI') === 0){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'O endereço do disparador ainda não foi configurado no portal.';
      return;
    }
    status.textContent = 'Buscando aparelhos inscritos...';
    let inscricoes = [];
    let porEndpoint = {};
    try{
      const snap = await getDocs(collection(dbF,'portal_push'));
      snap.forEach(function(d){
        const dados = d.data();
        if(dados.endpoint){ inscricoes.push(dados.endpoint); porEndpoint[dados.endpoint] = d.id; }
      });
    }catch(e){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Não foi possível ler a lista de aparelhos.';
      return;
    }
    if(!inscricoes.length){
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Ninguém ativou as notificações ainda.';
      return;
    }
    if(!confirm('Avisar '+inscricoes.length+' aparelho(s)?\n\n"'+recado.titulo+'\n'+recado.mensagem+'"')) { status.textContent=''; return; }
    status.textContent = 'Enviando...';
    try{
      // O recado precisa estar gravado antes do disparo: é dele que o celular lê o texto.
      await setDoc(doc(dbF,'portal_avisos','atual'), {
        titulo: recado.titulo, mensagem: recado.mensagem, enviadoEm: new Date().toISOString()
      });
      const resposta = await fetch(PUSH_ENDERECO, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: PUSH_SENHA, inscricoes: inscricoes })
      });
      const resultado = await resposta.json();
      if(!resposta.ok) throw new Error(resultado.erro || 'falha');
      // Aparelhos que saíram do ar (app desinstalado, navegador limpo) são removidos da lista.
      for(const endpoint of (resultado.expirados||[])){
        try{ await deleteDoc(doc(dbF,'portal_push', porEndpoint[endpoint])); }catch(e){}
      }
      status.style.color = 'var(--verde)';
      status.textContent = 'Aviso enviado para '+resultado.enviados+' aparelho(s).'+
        ((resultado.expirados&&resultado.expirados.length)?(' '+resultado.expirados.length+' inscrição(ões) expirada(s) foram removidas.'):'')+
        ((resultado.falhas&&resultado.falhas.length)?(' '+resultado.falhas.length+' falharam.'):'');
    }catch(e){
      console.error(e);
      status.style.color = 'var(--vermelho)';
      status.textContent = 'Não foi possível enviar agora.';
    }
  };

  // ===== Dúvidas sobre documentos =====
  // Uma conversa por colaborador, guardada num documento só (id = funcionarioId).
  // O colaborador abre pela aba Documentos; o RH responde pela aba Dúvidas.
  function agoraISO(){ return new Date().toISOString(); }

  async function carregarMinhaDuvida(){
    if(!funcionarioIdAtual) { minhaDuvida = null; return; }
    try{
      const snap = await getDoc(doc(dbF,'portal_duvidas', funcionarioIdAtual));
      minhaDuvida = snap.exists() ? snap.data() : null;
    }catch(e){ minhaDuvida = null; }
  }
  function bolhasConversa(conversa, ladoProprio){
    const mensagens = (conversa && conversa.mensagens) || [];
    if(!mensagens.length) return '<div class="vazio">Nenhuma mensagem ainda.</div>';
    return '<div class="conversa">'+mensagens.map(function(m){
      const minha = m.de === ladoProprio;
      return '<div class="balao '+(minha?'meu':'outro')+'">'+
        (m.documento?('<div class="balao-ref">Sobre: '+escaparHtml(m.documento)+'</div>'):'')+
        '<div class="balao-texto">'+escaparHtml(m.texto)+'</div>'+
        '<div class="balao-hora">'+(minha?'Você':(m.de==='rh'?'Administrativo':'Colaborador'))+' · '+formatarDataHoraBR(m.em)+'</div>'+
      '</div>';
    }).join('')+'</div>';
  }
  window.abrirMinhasDuvidas = async function(documentoRef){
    document.getElementById('modal-box').innerHTML = '<div class="vazio">Carregando...</div>';
    document.getElementById('modal-overlay').classList.add('aberto');
    await carregarMinhaDuvida();
    // Ao abrir, o que o RH respondeu deixa de ser novidade.
    if(minhaDuvida && minhaDuvida.naoLidasColaborador){
      try{ await setDoc(doc(dbF,'portal_duvidas', funcionarioIdAtual), { naoLidasColaborador: 0 }, { merge:true }); minhaDuvida.naoLidasColaborador = 0; }catch(e){}
    }
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>Dúvidas sobre documentos</h3><button class="icon-btn escuro" onclick="fecharModal(); renderDocumentosView();">'+icone('fechar')+'</button></div>'+
      (documentoRef?('<p class="dica-campo" style="margin-top:0">Sobre: '+escaparHtml(documentoRef)+'</p>'):'')+
      bolhasConversa(minhaDuvida, 'colaborador')+
      '<label style="margin-top:1rem">Sua mensagem</label>'+
      '<textarea id="f-duvida-texto" placeholder="Escreva sua dúvida sobre o documento"></textarea>'+
      '<div class="erro" id="f-duvida-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="enviarMinhaDuvida('+(documentoRef?("'"+escaparAspas(documentoRef)+"'"):'null')+')">Enviar</button>';
  };
  window.enviarMinhaDuvida = async function(documentoRef){
    const texto = document.getElementById('f-duvida-texto').value.trim();
    const erroEl = document.getElementById('f-duvida-erro');
    erroEl.style.color = 'var(--vermelho)';
    if(!texto){ erroEl.textContent = 'Escreva sua dúvida antes de enviar.'; return; }
    const mensagens = ((minhaDuvida && minhaDuvida.mensagens) || []).slice();
    mensagens.push({ de:'colaborador', texto:texto, em:agoraISO(), documento: documentoRef || '' });
    try{
      await setDoc(doc(dbF,'portal_duvidas', funcionarioIdAtual), {
        funcionarioId: funcionarioIdAtual,
        nome: perfilAtual.nome || '',
        mensagens: mensagens,
        atualizadoEm: agoraISO(),
        naoLidasRh: ((minhaDuvida && minhaDuvida.naoLidasRh) || 0) + 1,
        naoLidasColaborador: 0
      }, { merge:true });
      minhaDuvida = null;
      await abrirMinhasDuvidas(documentoRef);
    }catch(e){
      console.error(e);
      erroEl.textContent = 'Não foi possível enviar agora.';
    }
  };

  // Lado do RH
  async function carregarDuvidasAdmin(){
    const snap = await getDocs(collection(dbF,'portal_duvidas'));
    const arr = [];
    snap.forEach(function(d){ arr.push(Object.assign({_id:d.id}, d.data())); });
    arr.sort(function(a,b){ return (b.atualizadoEm||'').localeCompare(a.atualizadoEm||''); });
    listaDuvidasAdmin = arr;
  }
  async function renderAdminDuvidas(){
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio">Carregando...</div>';
    try{ await carregarDuvidasAdmin(); }
    catch(e){ cont.innerHTML = '<div class="vazio">Não foi possível carregar as dúvidas agora.</div>'; return; }
    if(!listaDuvidasAdmin.length){ cont.innerHTML = '<div class="vazio">Nenhuma dúvida enviada até agora.</div>'; return; }

  window.abrirDuvidaAdmin = async function(id){
    const conversa = listaDuvidasAdmin.find(function(c){ return c._id===id; });
    if(!conversa) return;
    if(conversa.naoLidasRh){
      try{ await setDoc(doc(dbF,'portal_duvidas', id), { naoLidasRh: 0 }, { merge:true }); conversa.naoLidasRh = 0; }catch(e){}
    }

      '<div class="topo-modal"><h3>'+(conversa.nome||id)+'</h3><button class="icon-btn escuro" onclick="fecharModal(); mostrarAdminTab(\'duvidas\');">'+icone('fechar')+'</button></div>'+
      bolhasConversa(conversa, 'rh')+
      '<label style="margin-top:1rem">Resposta</label>'+
      '<textarea id="f-resp-texto" placeholder="Escreva a resposta"></textarea>'+
      '<label class="checkbox-linha"><input type="checkbox" id="f-resp-notificar" checked> Notificar no celular do colaborador</label>'+
      '<div class="erro" id="f-resp-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="responderDuvida(\''+id+'\')">Responder</button>';
    document.getElementById('modal-overlay').classList.add('aberto');

  window.responderDuvida = async function(id){
    const texto = document.getElementById('f-resp-texto').value.trim();
    const erroEl = document.getElementById('f-resp-erro');
    const notificar = document.getElementById('f-resp-notificar').checked;
    erroEl.style.color = 'var(--vermelho)';
    if(!texto){ erroEl.textContent = 'Escreva a resposta antes de enviar.'; return; }
    const conversa = listaDuvidasAdmin.find(function(c){ return c._id===id; }) || {};
    const mensagens = (conversa.mensagens || []).slice();
    mensagens.push({ de:'rh', texto:texto, em:agoraISO(), documento:'' });
    try{
      await setDoc(doc(dbF,'portal_duvidas', id), {
        mensagens: mensagens,
        atualizadoEm: agoraISO(),
        naoLidasRh: 0,
        naoLidasColaborador: (conversa.naoLidasColaborador || 0) + 1
      }, { merge:true });
      if(notificar) await notificarUmColaborador(id);
      fecharModal();
      await mostrarAdminTab('duvidas');
    }catch(e){
      console.error(e);
      erroEl.textContent = 'Não foi possível responder agora.';
    }
  };
  // Notifica só o aparelho de quem perguntou, e não a empresa toda.
  async function notificarUmColaborador(funcionarioId){
    try{
      const snap = await getDocs(query(collection(dbF,'portal_push'), where('funcionarioId','==', funcionarioId)));
      const enderecos = [];
      snap.forEach(function(d){ if(d.data().endpoint) enderecos.push(d.data().endpoint); });
      if(!enderecos.length) return;
      await setDoc(doc(dbF,'portal_avisos','atual'), {
        titulo: 'O Administrativo respondeu você',
        mensagem: 'Sua dúvida sobre documentos tem uma resposta. Toque para abrir.',
        enviadoEm: agoraISO()
      });
      await fetch(PUSH_ENDERECO, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ senha: PUSH_SENHA, inscricoes: enderecos })
      });
    }catch(e){ console.warn('Não foi possível notificar a resposta', e); }
  }

  // ===== Cursos e treinamentos =====
  function renderTreinamentosView(){
    const cont = document.getElementById('view-treinamentos');
    cont.innerHTML = '<div class="sub-topo"><h2>Cursos e treinamentos</h2></div>'+
      '<div class="filtros-chips" id="treino-filtros"></div>'+
      '<div id="treinamentos-lista"></div>';
    desenharFiltrosTreino();
    desenharTreinamentos();
  }
  let filtroTreino = 'todos';
  function ehDoTipo(t, filtro){
    if(filtro==='todos') return true;
    // Cadastros antigos, sem classificação gravada, contam como treinamento.
    const semClassificacao = t.ehCurso === undefined && t.ehTreinamento === undefined;
    if(filtro==='curso') return t.ehCurso === true;
    return t.ehTreinamento === true || semClassificacao;
  }
  function desenharFiltrosTreino(){
    const cont = document.getElementById('treino-filtros');
    if(!cont) return;
    const opcoes = [['todos','Todos'],['treinamento','Treinamentos'],['curso','Cursos']];
    cont.innerHTML = opcoes.map(function(o){
      return '<button class="chip'+(filtroTreino===o[0]?' ativo':'')+'" onclick="filtrarTreinos(\''+o[0]+'\')">'+o[1]+'</button>';
    }).join('');
  }
  window.filtrarTreinos = function(valor){
    filtroTreino = valor;
    desenharFiltrosTreino();
    desenharTreinamentos();
  };
  function treinamentosVisiveisParaMim(){
    const meuSetorNorm = normalizar(perfilAtual.setor);
    return listaTreinamentos.filter(function(t){
      if(t.ativo===false) return false;
      if(!t.setores || !t.setores.length) return true;
      return t.setores.some(function(s){ return normalizar(s)===meuSetorNorm; });
    });
  }
  function cartaoTreinamento(t){
    const concl = listaConclusoes.find(function(c){ return c.treinamentoId===t._id; });
    let botoes = '';
    if(t.descricao) botoes += '<button class="btn btn-outline btn-sm" onclick="abrirDetalheTexto(\''+escaparAspas(t.titulo)+'\',\''+escaparAspas(t.descricao)+'\')">Saiba mais</button>';
    if(t.curso) botoes += '<a class="btn btn-azul btn-sm" href="'+t.curso+'" target="_blank" rel="noopener">Ir ao site</a>';
    if(t.video) botoes += '<button class="btn btn-outline btn-sm" onclick="abrirVideo(\''+escaparAspas(t.video)+'\')">Assistir vídeo</button>';
    if(t.pdf) botoes += '<a class="btn btn-outline btn-sm" href="'+t.pdf+'" target="_blank" rel="noopener">Abrir PDF</a>';
    const acaoConclusao = concl ?
      '<span class="concluido-tag">'+icone('check')+' Concluído em '+formatarDataBR(concl.dataConclusao)+'</span>' :
      '<button class="btn btn-azul btn-sm" onclick="concluirTreinamento(\''+t._id+'\')">Marcar como concluído</button>';
    const etiquetas = [];
    if(t.ehCurso) etiquetas.push('Curso');
    if(t.ehTreinamento || (t.ehCurso===undefined && t.ehTreinamento===undefined)) etiquetas.push('Treinamento');
    return '<div class="card-item">'+
      (t.imagem?('<img src="'+t.imagem+'" alt="">'):'')+
      '<div class="corpo">'+
        (etiquetas.length?('<div class="categoria">'+etiquetas.join(' · ')+'</div>'):'')+
        '<h4>'+(t.titulo||'')+'</h4>'+
        (t.descricao?('<p>'+resumir(t.descricao,140)+'</p>'):'')+
        '<div class="acoes">'+botoes+'</div>'+
        '<div style="margin-top:.7rem">'+acaoConclusao+'</div>'+
      '</div></div>';
  }
  function desenharTreinamentos(){
    const cont = document.getElementById('treinamentos-lista');
    const ativos = treinamentosVisiveisParaMim().filter(function(t){ return ehDoTipo(t, filtroTreino); });
    if(!ativos.length){ cont.innerHTML = '<div class="vazio">Nada disponível por aqui ainda.</div>'; return; }
    // Agrupado pela categoria (Fundação Bradesco, SESI...) para não virar uma lista solta.
    const grupos = {};
    ativos.forEach(function(t){
      const chave = (t.categoria||'').trim() || 'Outros';
      grupos[chave] = grupos[chave] || [];
      grupos[chave].push(t);
    });
    const nomes = Object.keys(grupos).sort(function(a,b){
      if(a==='Outros') return 1;
      if(b==='Outros') return -1;
      return a.localeCompare(b,'pt-BR');
    });
    if(nomes.length === 1){ cont.innerHTML = grupos[nomes[0]].map(cartaoTreinamento).join(''); return; }
    cont.innerHTML = nomes.map(function(nome){
      return blocoColapsavel(nome, grupos[nome].length, true, grupos[nome].map(cartaoTreinamento).join(''));
    }).join('');
  }
  window.concluirTreinamento = async function(treinamentoId){
    try{
      await addDoc(collection(dbF,'portal_treinamento_conclusoes'), {
        funcionarioId: funcionarioIdAtual, treinamentoId: treinamentoId,
        dataConclusao: new Date().toISOString().slice(0,10)
      });
      await carregarConclusoes();
      desenharTreinamentos();
      renderDashboard();
      renderPerfilView();
    }catch(e){ alert('Não foi possível registrar a conclusão agora.'); }
  };

  // ===== Comunicados =====
  function renderComunicadosView(){
    const cont = document.getElementById('view-comunicados');
    cont.innerHTML = '<div class="sub-topo"><h2>Comunicados</h2></div><div id="comunicados-lista"></div>';
    desenharComunicados();

  function comunicadosVisiveisParaMim(){
    const hoje = new Date().toISOString().slice(0,10);
    const meuSetorNorm = normalizar(perfilAtual.setor);
    return listaComunicados.filter(function(c){
      if(c.agendadoPara && c.agendadoPara>hoje) return false;
      if(!c.setores || !c.setores.length) return true;
      return c.setores.some(function(s){ return normalizar(s)===meuSetorNorm; });
    });
  }
  function desenharComunicados(){
    const cont = document.getElementById('comunicados-lista');
    const visiveis = comunicadosVisiveisParaMim();
    if(!visiveis.length){ cont.innerHTML = '<div class="vazio">Nenhum comunicado no momento.</div>'; return; }
    const ordenados = visiveis.slice().sort(function(a,b){
      const pf = (b.fixado?1:0)-(a.fixado?1:0);
      if(pf!==0) return pf;
      return (b.data||'').localeCompare(a.data||'');
    });
    cont.innerHTML = ordenados.map(function(c){
      return '<div class="feed-item'+(c.fixado?' fixado':'')+'">'+
        (c.fixado?('<div class="fix-badge">'+icone('pin')+' Fixado</div>'):'')+
        (c.setores&&c.setores.length?('<div class="fix-badge">Para: '+c.setores.join(', ')+'</div>'):'')+
        '<div class="meta"><span>'+(c.autor||'Pão & Tradição')+'</span><span>'+formatarDataBR(c.data)+'</span></div>'+
        '<h4>'+(c.titulo||'')+'</h4>'+
        (c.imagem?('<img src="'+c.imagem+'" alt="">'):'')+
        '<p>'+(c.texto||'')+'</p>'+
      '</div>';
    }).join('');
  }

  // ===== Perfil =====
  function renderPerfilView(){

  // Cria o acesso do colaborador e grava a ficha. Usado pelo formulário individual e pela
  // importação da planilha, para os dois criarem o login exatamente do mesmo jeito.
  // A conta é identificada pelo CPF: dois colaboradores de mesmo primeiro nome não se atrapalham.
  async function criarAcessoColaborador(nome, cpf, extras){
    const credencial = await createUserWithEmailAndPassword(authSecundario, emailPorCpf(cpf), cpf);
    // Os documentos são ligados ao funcionarioId, não ao login. Usando o CPF como
    // funcionarioId, se um dia for preciso excluir e cadastrar de novo (nome digitado
    // errado, por exemplo), os documentos já enviados continuam aparecendo para a pessoa.
    // Na migração de um acesso antigo, o funcionarioId de lá vem em extras e é preservado.
    const ficha = Object.assign({
      nome: nome, cpf: cpf, funcionarioId: 'cpf'+cpf, loginPorCpf: true, criadoEm: new Date().toISOString()
    }, extras || {});
    await setDoc(doc(dbF,'portal_funcionarios', credencial.user.uid), ficha);
    await signOut(authSecundario);
    return credencial.user.uid;
  }

  // ===== Importação da planilha de colaboradores =====
  // Lê a planilha do RH (nome, CPF, admissão e nascimento), casa cada linha com quem já está
  // cadastrado e mostra tudo para conferência. Nada é gravado antes de você confirmar.

  function paraDataISO(valor){
    if(valor === null || valor === undefined || valor === '') return '';
    if(valor && typeof valor.getFullYear === 'function' && !isNaN(valor.getTime())){
      const mm = String(valor.getMonth()+1).padStart(2,'0');
      const dd = String(valor.getDate()).padStart(2,'0');
      return valor.getFullYear()+'-'+mm+'-'+dd;
    }
    const texto = String(valor).trim();
    const br = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(br) return br[3]+'-'+br[2].padStart(2,'0')+'-'+br[1].padStart(2,'0');
    const iso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[0];
    // Data que veio como número de série do Excel (ex: 45670)
    const numero = Number(texto);
    if(numero > 10000 && numero < 80000){
      const d = new Date(Date.UTC(1899,11,30) + numero*86400000);
      return d.toISOString().slice(0,10);
    }
    return '';
  }

  // Os nomes da planilha vêm abreviados ("Cassiane M. de O. Barros") ou com partículas a mais
  // ("Bernardo Ferreira dos Santos"). Aqui cada pedaço do nome menor precisa aparecer, na ordem,
  // dentro do nome maior — aceitando inicial no lugar do nome inteiro.
  function nomesCompativeis(a, b){
    const pa = a.split(' ').filter(Boolean), pb = b.split(' ').filter(Boolean);
    if(pa.length < 2 || pb.length < 2) return false;
    const curto = pa.length <= pb.length ? pa : pb;
    const longo = pa.length <= pb.length ? pb : pa;
    if(curto[0] !== longo[0]) return false;
    if(curto[curto.length-1] !== longo[longo.length-1]) return false;
    let i = 0;
    for(let c = 0; c < curto.length; c++){
      let achou = false;
      while(i < longo.length){
        const l = longo[i], k = curto[c];
        i++;
        if(l === k || (k.length===1 && l[0]===k) || (l.length===1 && k[0]===l)){ achou = true; break; }
      }
      if(!achou) return false;
    }
    return true;
  }
  function vincularFichaPorPlanilha(linha){
    const cpf = linha.cpf;
    if(cpf){
      const porCpf = listaFuncionariosAdmin.find(function(f){ return String(f.cpf||'').replace(/\D/g,'') === cpf; });
      if(porCpf) return { ficha: porCpf, criterio: 'cpf' };
    }
    const alvo = normalizarNome(linha.nome);
    const exato = listaFuncionariosAdmin.find(function(f){ return normalizarNome(f.nome) === alvo; });
    if(exato) return { ficha: exato, criterio: 'exato' };
    let melhor = null, melhorNota = 0;
    listaFuncionariosAdmin.forEach(function(f){
      const nota = semelhanca(alvo, normalizarNome(f.nome));
      if(nota > melhorNota){ melhorNota = nota; melhor = f; }
    });
    if(melhor && melhorNota >= 0.85) return { ficha: melhor, criterio: 'parecido' };
    const porPartes = listaFuncionariosAdmin.find(function(f){ return nomesCompativeis(alvo, normalizarNome(f.nome)); });
    if(porPartes) return { ficha: porPartes, criterio: 'parecido' };
    return { ficha: null, criterio: 'novo' };
  }

  function lerPlanilhaColaboradores(dados){
    const wb = XLSX.read(dados, { type:'array', cellDates:true });
    for(let s=0; s<wb.SheetNames.length; s++){
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[s]], { header:1, blankrows:false, defval:'' });
      // Acha a linha de títulos pela coluna de CPF e descobre onde está cada informação.
      let iCab = -1, cols = null;
      for(let i=0; i<linhas.length && i<15; i++){
        const linha = linhas[i].map(function(c){ return String(c||'').toUpperCase(); });
        const cCpf = linha.findIndex(function(c){ return /C\.?\s*P\.?\s*F/.test(c); });
        if(cCpf >= 0){
          iCab = i;
          cols = {
            cpf: cCpf,
            admissao: linha.findIndex(function(c){ return /ADMISS/.test(c); }),
            nascimento: linha.findIndex(function(c){ return /NASC/.test(c); }),
            nome: Math.max(0, linha.findIndex(function(c){ return /NOME/.test(c); }))
          };
          break;
        }
      }
      if(iCab < 0) continue;
      const encontradas = [];
      for(let i=iCab+1; i<linhas.length; i++){
        const linha = linhas[i];
        const nome = String(linha[cols.nome]||'').replace(/\s+/g,' ').trim();
        const cpf = String(linha[cols.cpf]||'').replace(/\D/g,'');
        if(!nome || nome.length < 3) continue;
        encontradas.push({
          nome: nome,
          cpf: cpf.length===11 ? cpf : '',
          cpfBruto: String(linha[cols.cpf]||'').trim(),
          dataAdmissao: cols.admissao >= 0 ? paraDataISO(linha[cols.admissao]) : '',
          dataNascimento: cols.nascimento >= 0 ? paraDataISO(linha[cols.nascimento]) : ''
        });
      }
      if(encontradas.length) return encontradas;
    }
    return [];
  }

    document.getElementById('modal-box').innerHTML =

      '<p style="color:var(--texto-2);font-size:.83rem;line-height:1.6;margin:0 0 1.1rem">A planilha precisa ter uma coluna de CPF. O nome fica na primeira coluna (ou numa coluna chamada NOME), e as datas nas colunas de admissão e nascimento. O portal mostra tudo para conferência antes de gravar.</p>'+
      '<label>Planilha (Excel ou CSV)</label><input type="file" id="f-imp-arquivo" accept=".xlsx,.xlsm,.csv">'+
      '<div class="erro" id="f-imp-erro"></div>'+

  window.processarPlanilha = async function(){
    const arquivo = (document.getElementById('f-imp-arquivo').files||[])[0];
    const erroEl = document.getElementById('f-imp-erro');
    erroEl.style.color = 'var(--vermelho)';
    if(!arquivo){ erroEl.textContent = 'Escolha a planilha.'; return; }
    if(!window.XLSX){ erroEl.textContent = 'O leitor de planilha não carregou. Verifique a internet e recarregue a página.'; return; }
    fecharModal();
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio">Lendo a planilha...</div>';
    try{
      await carregarFuncionariosAdmin(true);
      const buffer = await arquivo.arrayBuffer();
      const linhas = lerPlanilhaColaboradores(new Uint8Array(buffer));
      if(!linhas.length){
        cont.innerHTML = '<div class="vazio">Não encontrei uma coluna de CPF nessa planilha.</div>'+
          '<button class="btn btn-outline btn-full" style="margin-top:1rem" onclick="mostrarAdminTab(\'colaboradores\')">Voltar</button>';
        return;
      }
      importAtual = linhas.map(function(l){
        const vinculo = vincularFichaPorPlanilha(l);
        const ficha = vinculo.ficha;
        const item = Object.assign({}, l, {
          fichaId: ficha ? ficha._id : '',
          criterio: vinculo.criterio,
          gravado: false,
          falhou: ''
        });
        item.acao = definirAcaoImport(item, ficha);
        item.incluir = item.acao !== 'nada' && item.acao !== 'sem-cpf' && item.acao !== 'cpf-diferente';
        return item;
      });
      renderRevisaoImport();
    }catch(e){
      console.error(e);
      cont.innerHTML = '<div class="vazio">Não foi possível ler essa planilha.</div>'+
        '<button class="btn btn-outline btn-full" style="margin-top:1rem" onclick="mostrarAdminTab(\'colaboradores\')">Voltar</button>';
    }
  };

  function definirAcaoImport(item, ficha){
    if(!item.cpf) return 'sem-cpf';
    if(!ficha) return 'criar';
    const cpfFicha = String(ficha.cpf||'').replace(/\D/g,'');
    if(cpfFicha && cpfFicha !== item.cpf) return 'cpf-diferente';
    // Ficha antiga (login montado pelo nome completo): precisa de acesso novo pelo CPF.
    if(!ficha.loginPorCpf) return 'migrar';
    const mudaCpf = !cpfFicha;
    const mudaAdm = item.dataAdmissao && ficha.dataAdmissao !== item.dataAdmissao;
    const mudaNasc = item.dataNascimento && ficha.dataNascimento !== item.dataNascimento;
    return (mudaCpf || mudaAdm || mudaNasc) ? 'atualizar' : 'nada';
  }
  function seloImport(d){
    if(d.gravado) return '<span class="selo selo-ok">'+(d.acao==='criar'?'Cadastrado':(d.acao==='migrar'?'Acesso migrado':'Atualizado'))+'</span>';
    if(d.falhou) return '<span class="selo selo-erro">'+d.falhou+'</span>';
    if(d.acao==='sem-cpf') return '<span class="selo selo-erro">CPF inválido na planilha</span>';
    if(d.acao==='cpf-diferente') return '<span class="selo selo-erro">CPF diferente do cadastrado</span>';
    if(d.acao==='criar') return '<span class="selo selo-aviso">Vai cadastrar</span>';
    if(d.acao==='migrar') return '<span class="selo selo-aviso">Vai migrar o acesso</span>';
    if(d.acao==='nada') return '<span class="selo selo-ok">Já está completo</span>';
    if(d.criterio==='parecido') return '<span class="selo selo-aviso">Nome parecido, confira</span>';
    return '<span class="selo selo-ok">Vai preencher</span>';
  }
  function renderRevisaoImport(){
    const cont = document.getElementById('admin-conteudo');
    const linhas = importAtual.map(function(d, i){
      const opcoes = listaFuncionariosAdmin.map(function(f){
        return '<option value="'+f._id+'"'+(f._id===d.fichaId?' selected':'')+'>'+(f.nome||'')+'</option>';
      }).join('');
      const detalhes = [];

  window.gravarImportacao = async function(){
    const pendentes = importAtual.filter(function(d){ return d.incluir && !d.gravado && d.cpf; });
    const status = document.getElementById('imp-status');
    const btn = document.getElementById('imp-btn-gravar');
    status.style.color = 'var(--texto-2)';
    if(!pendentes.length){ status.style.color='var(--vermelho)'; status.textContent = 'Nenhuma linha selecionada.'; return; }
    const novos = pendentes.filter(function(d){ return d.acao==='criar'; }).length;
    const migrados = pendentes.filter(function(d){ return d.acao==='migrar'; }).length;
    let aviso = 'Gravar '+pendentes.length+' linha(s)?';
    if(novos) aviso += '\n\n'+novos+' colaborador(es) vão receber acesso novo.';
    if(migrados) aviso += '\n\n'+migrados+' acesso(s) serão migrados: a partir de agora essas pessoas entram com o PRIMEIRO NOME e o CPF, e a forma antiga deixa de funcionar. Os documentos já enviados continuam no lugar.';
    if(novos || migrados) aviso += '\n\nTodos entram com o primeiro nome e o CPF (só números) como senha.';
    if(!confirm(aviso)) return;
    btn.disabled = true;
    let ok = 0, falhas = 0;
    for(let i=0;i<pendentes.length;i++){
      const d = pendentes[i];
      status.textContent = 'Gravando '+(i+1)+' de '+pendentes.length+'...';
      try{
        const campos = { cpf: d.cpf };
        if(d.dataAdmissao) campos.dataAdmissao = d.dataAdmissao;
        if(d.dataNascimento) campos.dataNascimento = d.dataNascimento;
        if(d.acao === 'migrar'){
          // Cria o acesso novo pelo CPF preservando o funcionarioId antigo (senão os documentos
          // já enviados ficariam órfãos) e só depois apaga a ficha velha, que deixa de valer.
          const antiga = listaFuncionariosAdmin.find(function(f){ return f._id===d.fichaId; }) || {};
          const extras = Object.assign({}, campos);
          if(antiga.funcionarioId) extras.funcionarioId = antiga.funcionarioId;
          if(antiga.foto) extras.foto = antiga.foto;
          if(antiga.cargo) extras.cargo = antiga.cargo;
          if(antiga.setor) extras.setor = antiga.setor;
          if(!extras.dataAdmissao && antiga.dataAdmissao) extras.dataAdmissao = antiga.dataAdmissao;
          if(!extras.dataNascimento && antiga.dataNascimento) extras.dataNascimento = antiga.dataNascimento;
          await criarAcessoColaborador(antiga.nome || d.nome, d.cpf, extras);
          await deleteDoc(doc(dbF,'portal_funcionarios', d.fichaId));
        }
        else if(d.fichaId) await updateDoc(doc(dbF,'portal_funcionarios', d.fichaId), campos);
        else await criarAcessoColaborador(d.nome, d.cpf, campos);
        d.gravado = true;
        d.incluir = false;
        ok++;
      }catch(e){
        console.error('Falha ao gravar '+d.nome, e);
        d.falhou = (e && e.code === 'auth/email-already-in-use') ? 'Já existe acesso com esse CPF' : 'Falhou, tente de novo';
        falhas++;
      }
    }
    await carregarFuncionariosAdmin(true);
    renderRevisaoImport();
    const fim = document.getElementById('imp-status');
    fim.style.color = falhas ? 'var(--vermelho)' : 'var(--verde)';
    fim.textContent = ok+' linha(s) gravada(s).'+(falhas?(' '+falhas+' falharam.'):'');
  };

  // Folha de registro para anexar à ata da CIPA. Serve para a campanha do mês e para os
  // comunicados marcados como divulgação da NR-1. Abre em janela separada e chama a impressão
  // do navegador — dá para salvar em PDF sem depender de nenhuma biblioteca.
  function abrirFolhaImpressao(dados){
    const agora = new Date();
    const emitido = agora.toLocaleDateString('pt-BR')+' às '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const html =
      '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>'+escaparHtml(dados.titulo)+'</title>'+
      '<style>'+
        '@page{margin:1.4cm 1.6cm}'+
        'body{font-family:Georgia,serif;color:#13215E;line-height:1.45;margin:0;font-size:10.5pt}'+
        '.cabecalho{border-bottom:2px solid #E8A33D;padding-bottom:.35rem;margin-bottom:.9rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}'+
        '.empresa{font-size:8.5pt;color:#5A6178;margin:0}'+
        '.rotulo{font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:#8a5a00;margin:0}'+
        'h1{font-size:14pt;margin:0 0 .15rem}'+
        '.periodo{font-size:9pt;color:#5A6178;margin:0 0 .8rem}'+
        '.texto{white-space:pre-wrap;text-align:justify;margin:0}'+
        'img{max-width:11cm;max-height:6.5cm;object-fit:contain;display:block;margin:.7rem auto;border:1px solid #ddd}'+
        '.material{font-size:8.5pt;color:#5A6178;margin-top:.8rem;word-break:break-all}'+
        '.assinatura{width:8cm;margin:1.6cm auto 0;border-top:1px solid #13215E;padding-top:.3rem;font-size:8.5pt;text-align:center}'+
        '.rodape{margin-top:.9rem;border-top:1px solid #ddd;padding-top:.35rem;font-size:7.5pt;color:#5A6178;display:flex;justify-content:space-between}'+
        '.aviso{background:#F5F0DC;padding:.6rem .9rem;border-radius:8px;font-size:9pt;margin-bottom:1rem;font-family:Arial,sans-serif}'+
        '@media print{.aviso{display:none}}'+
      '</style></head><body>'+
      '<div class="aviso">Use o comando de impressão do navegador. Para guardar em arquivo, escolha "Salvar como PDF" no destino da impressão.</div>'+
      '<div class="cabecalho">'+
        '<p class="rotulo">'+escaparHtml(dados.rotulo)+'</p>'+
        '<p class="empresa">MAGIW Panificadora de Friburgo LTDA · CNPJ 06.859.989/0001-70</p>'+
      '</div>'+
      '<h1>'+escaparHtml(dados.titulo)+'</h1>'+
      '<p class="periodo">'+escaparHtml(dados.subtitulo)+'</p>'+
      (dados.imagem?('<img src="'+escaparHtml(dados.imagem)+'" alt="">'):'')+
      (dados.texto?('<div class="texto">'+escaparHtml(dados.texto)+'</div>'):'')+
      (dados.material?('<p class="material"><strong>Material em vídeo:</strong> '+escaparHtml(dados.material)+'</p>'):'')+
      '<div class="assinatura">Responsável pela divulgação</div>'+
      '<div class="rodape"><span>Emitido em '+emitido+'</span><span>Portal do Colaborador</span></div>'+
      '</body></html>';
    const janela = window.open('', '_blank');
    if(!janela){ alert('O navegador bloqueou a janela de impressão. Libere os pop-ups para este site e tente de novo.'); return; }
    janela.document.write(html);
    janela.document.close();
    // Espera a imagem carregar antes de chamar a impressão, senão ela sai em branco.
    janela.onload = function(){ setTimeout(function(){ janela.print(); }, 400); };
  }
